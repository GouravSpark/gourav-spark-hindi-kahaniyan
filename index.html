<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f8f1">
<title>Gourav Spark Hindi Kahaniyan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap');
:root{--bg:#f3f8f1;--paper:#fff;--ink:#20352a;--muted:#64756a;--green:#246b45;--line:#e1ebe2;--shadow:0 8px 28px rgba(27,67,42,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Devanagari',sans-serif;line-height:1.7}
header{background:linear-gradient(135deg,#e8f4e9,#f8fbf6);border-bottom:1px solid var(--line);padding:28px 16px 22px;text-align:center}
h1,h2,.story-title{font-family:'Tiro Devanagari Hindi',serif}
h1{font-size:clamp(1.8rem,6vw,2.7rem);line-height:1.3;margin:0;color:var(--green)}
.tagline{margin:7px 0 0;color:var(--muted);font-size:.92rem}
main{width:min(100% - 28px,900px);margin:22px auto 50px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:18px}
.filter{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 7px;color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer;min-width:0}
.filter.active{background:var(--green);border-color:var(--green);color:white}
.filter .symbol{display:block;width:25px;height:25px;margin:0 auto 4px}.filter .symbol svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.filter .count{font-size:.75rem;opacity:.8}
.toolbar{display:flex;gap:10px;align-items:center;margin:0 0 16px}
.search{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:12px 14px;font:inherit;color:var(--ink);outline-color:var(--green)}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.story-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);cursor:pointer}
.category-label{font-size:.78rem;font-weight:700;color:var(--cat,var(--green));display:flex;align-items:center;gap:6px}.mini-icon{display:inline-flex;width:18px;height:18px}.mini-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.story-title{font-size:1.25rem;line-height:1.45;margin:5px 0 7px}
.preview{margin:0;color:var(--muted);font-size:.92rem}
.read-time{margin-top:10px;color:var(--muted);font-size:.78rem}
.story-card:focus-visible,.filter:focus-visible,button:focus-visible{outline:3px solid #83b99a;outline-offset:2px}
.hidden{display:none!important}
#reader{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.back{border:0;background:transparent;color:var(--green);font:inherit;font-weight:700;padding:3px 0 12px;cursor:pointer}
.reader-meta{font-size:.86rem;font-weight:700;color:var(--cat,var(--green));display:flex;align-items:center;gap:7px}.reader-meta svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.reader-heading{font-size:1.65rem;line-height:1.45;margin:5px 0 12px}
.font-tools{display:flex;justify-content:flex-end;gap:8px;margin:10px 0 18px}
.font-tools button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 13px;font:inherit;cursor:pointer}
.story-body{font-size:1.16rem;line-height:2.05;white-space:pre-wrap;overflow-wrap:anywhere}
.story-body p{margin:0 0 1.15em}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:22px 12px 30px}
@media(min-width:620px){.filters{grid-template-columns:repeat(5,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}#reader{padding:28px}.story-body{font-size:1.22rem}}
@media(prefers-color-scheme:dark){:root{--bg:#111b15;--paper:#19251d;--ink:#e5eee7;--muted:#a5b6aa;--green:#83c69a;--line:#2b3c30;--shadow:0 8px 28px rgba(0,0,0,.18)}header{background:linear-gradient(135deg,#1b3022,#17231b)}.filter.active{background:#286743;color:#fff}.font-tools button{background:#223127}}
</style>
</head>
<body>
<header>
  <h1>Gourav Spark Hindi Kahaniyan</h1>
  <p class="tagline">हर कहानी में एक नई दुनिया, हर अंत में एक नई सीख</p>
</header>
<main>
  <section id="home">
    <nav class="filters" id="filters" aria-label="कहानी की श्रेणियाँ"></nav>
    <div class="toolbar"><input id="search" class="search" type="search" placeholder="कहानी खोजें..." aria-label="कहानी खोजें"></div>
    <section class="cards" id="cards" aria-live="polite"></section>
  </section>
  <article id="reader" class="hidden">
    <button class="back" id="back">← वापस</button>
    <div class="reader-meta" id="readerCategory"></div>
    <h2 class="reader-heading" id="readerTitle"></h2>
    <div class="font-tools"><button id="smaller" aria-label="अक्षर छोटे करें">अ−</button><button id="larger" aria-label="अक्षर बड़े करें">अ+</button></div>
    <div class="story-body" id="storyBody"></div>
  </article>
</main>
<footer>Gourav Spark Hindi Kahaniyan · पढ़ें, सोचें और आगे बढ़ें</footer>
<script>
const iconSvg = {
 mountain:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20 9 6l4 8 3-5 6 11H2Z M7 10l2 2 2-2" /></svg>',
 balloon:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-4 0-7 3-7 7 0 5 7 10 7 10s7-5 7-10c0-4-3-7-7-7Z M12 20l-1 2h2l-1-2" /></svg>',
 bulb:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4m-2-19a7 7 0 0 0-4 12c1 1 1 2 1 4h6c0-2 0-3 1-4a7 7 0 0 0-4-12Z" /></svg>',
 house:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v10H3V11Z M9 21v-7h6v7" /></svg>',
 ghost:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V10a7 7 0 0 1 14 0v11l-3-2-2 2-2-2-2 2-2-2-3 2Z M9 10h.01M15 10h.01" /></svg>',
 heart:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5-8.8 11-8.8 11s-8.8-6-8.8-11A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 8.8 2.8Z" /></svg>',
 smile:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 3 4 3 4-3 4-3M9 9h.01M15 9h.01" /></svg>',
 plant:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9m0 4c-5 0-8-3-8-8 5 0 8 3 8 8Zm0-4c0-5 3-8 8-8 0 5-3 8-8 8Z" /></svg>',
 all:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>'
};
const categories = [
 {name:'प्रेरक',icon:'mountain',color:'#3d8a58'},
 {name:'बच्चों की',icon:'balloon',color:'#d58a28'},
 {name:'सीख वाली',icon:'bulb',color:'#b58a20'},
 {name:'पारिवारिक',icon:'house',color:'#b66d45'},
 {name:'डरावनी',icon:'ghost',color:'#8063a8'},
 {name:'प्रेम',icon:'heart',color:'#d45c75'},
 {name:'हास्य',icon:'smile',color:'#d18a32'},
 {name:'जीवन-संघर्ष',icon:'plant',color:'#438c70'}
];
const stories = [
 {category:'प्रेरक',title:'नंगे पाँव की दौड़',time:'पढ़ने का समय जल्द जोड़ा जाएगा',text:''},
 {category:'बच्चों की',title:'बंटू की गाजरें',time:'पढ़ने का समय जल्द जोड़ा जाएगा',text:''},
 {category:'सीख वाली',title:'दीनू मोची का बटुआ',time:'पढ़ने का समय जल्द जोड़ा जाएगा',text:''},
 {category:'पारिवारिक',title:'दादाजी की पुरानी घड़ी',time:'पढ़ने का समय जल्द जोड़ा जाएगा',text:''},
 {category:'डरावनी',title:'बारह बजे की घंटी',time:'पढ़ने का समय जल्द जोड़ा जाएगा',text:''},
 {category:'प्रेम',title:'किताब के बीच की चिट्ठी',time:'पढ़ने का समय जल्द जोड़ा जाएगा',text:''},
 {category:'हास्य',title:'सरपंच जी की बकरी और भाषण',time:'पढ़ने का समय जल्द जोड़ा जाएगा',text:''},
 {category:'जीवन-संघर्ष',title:'शोभा का टिफ़िन',time:'पढ़ने का समय जल्द जोड़ा जाएगा',text:''}
];
let selected='सभी', current=null;
const filters=document.getElementById('filters'),cards=document.getElementById('cards');
const counts=()=>Object.fromEntries(categories.map(c=>[c.name,stories.filter(s=>s.category===c.name).length]));
function renderFilters(){
 const total=stories.length, count=counts();
 filters.innerHTML='';
 [{name:'सभी',icon:'▦',color:'#246b45'},...categories].forEach(c=>{
  const b=document.createElement('button');b.className='filter'+(selected===c.name?' active':'');
  b.innerHTML=`<span class="symbol" style="color:${selected===c.name?'white':c.color}">${c.name==='सभी'?iconSvg.all:iconSvg[c.icon]}</span>${c.name}<span class="count"> (${c.name==='सभी'?total:count[c.name]})</span>`;
  b.onclick=()=>{selected=c.name;renderFilters();renderCards()};filters.appendChild(b);
 });
}
function renderCards(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const list=stories.filter(s=>(selected==='सभी'||s.category===selected)&&(`${s.title} ${s.category}`).toLowerCase().includes(q));
 cards.innerHTML='';
 if(!list.length){cards.innerHTML='<div class="empty">इस श्रेणी में अभी कोई कहानी नहीं है।</div>';return}
 list.forEach(s=>{
  const cat=categories.find(c=>c.name===s.category);
  const el=document.createElement('article');el.className='story-card';el.tabIndex=0;el.style.setProperty('--cat',cat.color);
  const first=s.text? s.text.split('\n').filter(Boolean).slice(0,2).join(' '):'इस कहानी का पूरा पाठ जल्द जोड़ा जाएगा।';
  el.innerHTML=`<div class="category-label"><span class="mini-icon">${iconSvg[cat.icon]}</span> ${s.category}</div><h2 class="story-title"></h2><p class="preview"></p><div class="read-time">${s.time}</div>`;
  el.querySelector('h2').textContent=s.title;el.querySelector('.preview').textContent=first;
  el.onclick=()=>openStory(s);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openStory(s)}};
  cards.appendChild(el);
 });
}
function openStory(s){
 current=s;const cat=categories.find(c=>c.name===s.category);
 document.getElementById('home').classList.add('hidden');document.getElementById('reader').classList.remove('hidden');
 document.getElementById('readerCategory').innerHTML=iconSvg[cat.icon]+' '+s.category;
 document.getElementById('readerCategory').style.setProperty('--cat',cat.color);
 document.getElementById('readerTitle').textContent=s.title;
 const body=document.getElementById('storyBody');body.textContent=s.text||'इस कहानी का पूरा पाठ अभी वेबसाइट में जोड़ा नहीं गया है। कहानी का मूल पाठ मिलने पर उसे बिना कोई शब्द बदले यहाँ जोड़ा जाएगा।';
 body.style.fontSize=(Number(localStorage.getItem('storyFontSize'))||18)+'px';
 window.scrollTo(0,0);
}
function closeStory(){document.getElementById('reader').classList.add('hidden');document.getElementById('home').classList.remove('hidden');window.scrollTo(0,0)}
document.getElementById('back').onclick=closeStory;
document.getElementById('search').addEventListener('input',renderCards);
function changeFont(delta){const body=document.getElementById('storyBody');let n=parseInt(body.style.fontSize)||18;n=Math.max(16,Math.min(28,n+delta));body.style.fontSize=n+'px';localStorage.setItem('storyFontSize',n)}
document.getElementById('smaller').onclick=()=>changeFont(-2);
document.getElementById('larger').onclick=()=>changeFont(2);
renderFilters();renderCards();
</script>
</body>
</html>
