<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Gourav Spark की हिंदी कहानियाँ: प्रेरक, बच्चों की, सीख वाली, पारिवारिक, डरावनी, प्रेम, हास्य और जीवन-संघर्ष।">
<title>Gourav Spark Hindi Kahaniyan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: one narrow reading column; home = category chips + story list, story = single reader view */
:root {
  --bg: #f2f5f4;
  --surface: #ffffff;
  --fg: #16231f;
  --muted: #5a6b66;
  --line: #d6dfdc;
  --accent: #0f5c54;
  --accent-fg: #ffffff;
  --chip: #e3ebe8;
  --c1: #c2562d; --c2: #d99a1e; --c3: #3b7f4a; --c4: #6b4aa0;
  --c5: #8a2f3d; --c6: #c9487a; --c7: #d27a14; --c8: #2f6fa8;
  --f-display: 'Tiro Devanagari Hindi', 'Noto Serif Devanagari', Georgia, serif;
  --f-body: 'Noto Sans Devanagari', 'Mukta', system-ui, sans-serif;
  --read-size: 1.125rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1816; --surface: #17231f; --fg: #e6efec; --muted: #9bb0aa;
    --line: #2a3a35; --accent: #5cc5b6; --accent-fg: #082420; --chip: #1f2e29;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1816; --surface: #17231f; --fg: #e6efec; --muted: #9bb0aa;
  --line: #2a3a35; --accent: #5cc5b6; --accent-fg: #082420; --chip: #1f2e29;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 1rem; line-height: 1.7;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

header.top a.brand { display: inline-block; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 2.1rem; line-height: 1.2; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 999px; background: var(--chip);
  font-size: 0.95rem; font-weight: 500; border: 1px solid transparent;
}
.ic { display: inline-flex; flex: none; width: 20px; height: 20px; color: var(--ic, var(--muted)); }
.ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chip[aria-current="true"] .ic { color: var(--accent-fg); }
.chip .n { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.chip[aria-current="true"] { background: var(--accent); color: var(--accent-fg); }
.chip[aria-current="true"] .n { color: inherit; opacity: 0.85; }

.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.list-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; margin: 0; }
.list-head span { color: var(--muted); font-size: 0.9rem; }

.stories { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card {
  display: flex; flex-direction: column; gap: 8px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
}
.card:hover { border-color: var(--accent); }
.card .cat { display: inline-flex; align-items: center; gap: 7px; font-size: 0.82rem; color: var(--muted); }
.card .cat .ic { width: 18px; height: 18px; }
.card h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; line-height: 1.35; margin: 0; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 0.93rem; line-height: 1.6; }
.card .meta { margin-top: auto; font-size: 0.82rem; color: var(--muted); }

/* reader */
.reader { display: flex; flex-direction: column; gap: 18px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.back { font-weight: 500; color: var(--accent); padding: 6px 0; }
.sizes { display: inline-flex; gap: 6px; }
.sizes button {
  font: inherit; font-weight: 600; min-width: 44px; height: 40px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
}
.sizes button:hover { border-color: var(--accent); }
.reader h2 { font-family: var(--f-display); font-weight: 400; font-size: 2rem; line-height: 1.3; margin: 0; text-wrap: balance; }
.reader .tag { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; }
.reader .tag .ic { width: 22px; height: 22px; }
.body { font-size: var(--read-size); line-height: 1.95; max-width: 40em; display: flex; flex-direction: column; gap: 1.1em; }
.body p { margin: 0; }
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
.stats[hidden] { display: none; }
.stat { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--chip); color: var(--fg); font: inherit; font-weight: 500; border: 1px solid transparent; font-variant-numeric: tabular-nums; }
.stat svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
button.stat { cursor: pointer; }
button.stat:hover { border-color: var(--accent); }
button.stat[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
button.stat[aria-pressed="true"] svg { fill: currentColor; }
button.stat:disabled { cursor: default; opacity: 0.7; }
.stat-note { color: var(--muted); font-size: 0.85rem; flex-basis: 100%; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.meta .cnt { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.meta .cnt svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.seek { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.seek h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; margin: 0; }

footer { color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--line); padding-top: 14px; }
@media (max-width: 480px) { .brand h1 { font-size: 1.8rem; } .reader h2 { font-size: 1.65rem; } }
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
var CATS = [
  { id: 'prerak',   name: 'प्रेरक',        color: 'var(--c1)' },
  { id: 'bachche',  name: 'बच्चों की',     color: 'var(--c2)' },
  { id: 'seekh',    name: 'सीख वाली',      color: 'var(--c3)' },
  { id: 'parivar',  name: 'पारिवारिक',     color: 'var(--c7)' },
  { id: 'darawni',  name: 'डरावनी',        color: 'var(--c4)' },
  { id: 'prem',     name: 'प्रेम',          color: 'var(--c6)' },
  { id: 'hasya',    name: 'हास्य',          color: 'var(--c8)' },
  { id: 'sangharsh',name: 'जीवन-संघर्ष',   color: 'var(--c5)' }
];

/* हर कहानी में सिर्फ़ एक cat होती है */
var STORIES = [
  { id: 1, cat: "prerak", title: "नंगे पाँव की दौड़", mins: "5-6", body: ["कविता का गाँव मोहनपुर था। वहाँ सुबह सबसे पहले मुर्गा नहीं, कविता उठती थी।", "वह रोज़ चार बजे खेतों की मेड़ पर दौड़ने जाती थी। उसके पैरों में जूते नहीं थे। लोग हँसकर कहते, \"नंगे पाँव कोई दौड़ जीतता है क्या?\" कविता चुपचाप मुस्कुरा देती।", "कविता के पिताजी मज़दूरी करते थे। माँ दूसरों के घर बर्तन माँजती थीं। घर में दो वक़्त की रोटी मुश्किल से बनती थी। जूतों के पैसे कहाँ से आते?", "पर कविता के पास एक चीज़ थी। उसे दौड़ना बहुत पसंद था।", "एक दिन स्कूल में दौड़ की प्रतियोगिता हुई। कविता भी मैदान में उतरी। बाकी बच्चों ने नए जूते पहने थे। कविता के पाँव धूल से सने थे।", "सीटी बजी और सब दौड़ पड़े। कविता सबसे आगे निकल गई। वह पहले नंबर पर आई। पूरा स्कूल तालियों से गूँज उठा।", "खेल के मास्टर रमेश जी ने उसे बुलाया। \"बेटी, तुम में दम है,\" उन्होंने कहा। \"अगले महीने ज़िले की दौड़ है। क्या तुम चलोगी?\" कविता की आँखें चमक उठीं। उसने तुरंत हाँ कर दी।", "ज़िले की दौड़ शहर के बड़े मैदान में थी। कविता ने ऐसा मैदान पहले कभी नहीं देखा था। वहाँ सब लड़कियाँ चमकीले कपड़ों और महँगे जूतों में थीं। कविता घबरा गई।", "दौड़ शुरू हुई। कविता ने पूरा ज़ोर लगाया। पर पथरीली ज़मीन पर उसके पाँव में काँटा चुभ गया। वह लड़खड़ा गई। वह चौथे नंबर पर आई और रो पड़ी।", "गाँव लौटकर वह कई दिन उदास रही। उसने दौड़ना भी छोड़ दिया। एक शाम माँ उसके पास बैठीं। \"हारी तो क्या हुआ?\" माँ ने पूछा। \"तू गिरी थी, पर उठकर दौड़ पूरी की। यह कम बात नहीं।\"", "कविता ने माँ की बात सुनी। उसके मन में फिर हिम्मत आई।", "अगली सुबह चार बजे वह फिर मेड़ पर थी। इस बार वह पथरीली ज़मीन पर भी दौड़ी। उसके पाँव मज़बूत होते गए। रमेश जी उसे नए तरीके सिखाने लगे।", "गाँव के लोग भी बदल गए। कोई उसे दूध देता, कोई गुड़। एक दुकानदार ने उसके लिए जूते भेजे। कविता ने धन्यवाद कहकर रख लिए।", "एक साल बाद फिर ज़िले की दौड़ आई। कविता उसी बड़े मैदान में खड़ी थी। इस बार उसका मन शांत था। सीटी बजी और वह हवा की तरह भागी।", "आख़िरी मोड़ पर दो लड़कियाँ उससे आगे थीं। कविता ने साँस भरी और पूरा दम लगा दिया। वह पहले एक को पार कर गई, फिर दूसरी को। फ़ीता उसके सीने से टकराया। वह जीत गई थी।", "मैदान में शोर मच गया। रमेश जी की आँखें भर आईं। गाँव में ढोल बजे और मिठाई बँटी। माँ ने कविता को गले से लगा लिया।", "कविता ने सीखा कि हार रुकना नहीं है, बस रास्ते का एक मोड़ है।"] },
  { id: 2, cat: "bachche", title: "बंटू की गाजरें", mins: "5-6", body: ["हरी घाटी में एक छोटा खरगोश रहता था। उसका नाम बंटू था। उसे गाजर सबसे ज़्यादा पसंद थीं।", "बंटू के पास एक छोटा सा खेत था। उसमें लाल-लाल गाजरें उगती थीं। वह रोज़ उन्हें पानी देता। वह रोज़ उनसे बातें करता।", "घाटी में उसके कई दोस्त थे। चीकू गिलहरी, मिट्ठू तोता और धीरू कछुआ। सब बंटू के खेत के पास खेलने आते। बंटू को भी उनके साथ खेलना अच्छा लगता था।", "पर एक बात बंटू को पसंद नहीं थी। जब कोई गाजर माँगता, तो वह मुँह बना लेता। \"यह मेरी है,\" वह कहता। \"मैंने उगाई है।\"", "एक साल बारिश नहीं हुई। घाटी की घास सूख गई। पेड़ों के फल भी कम हो गए। सबके घर में खाना कम पड़ने लगा।", "बंटू का खेत भी सूखने लगा। पर नदी के पास की मिट्टी में कुछ गाजरें बच गईं। बंटू ने उन्हें खोदा और घर ले आया। उसने सारी गाजरें अपनी कोठरी में छिपा लीं।", "उसने दरवाज़ा बंद कर लिया। \"अब ये सिर्फ़ मेरी हैं,\" उसने सोचा। फिर उसने एक गाजर खाई। पर आज उसे वह मीठी नहीं लगी।", "शाम को बाहर से आवाज़ आई। \"बंटू भैया, दरवाज़ा खोलो!\" यह चीकू की आवाज़ थी। बंटू चुप बैठा रहा। उसने कोई जवाब नहीं दिया।", "चीकू धीरे से बोला, \"हम तीन दिन से भूखे हैं।\" फिर आवाज़ें दूर चली गईं। बंटू का दिल धक-धक करने लगा। उसे अपने दोस्तों की याद आई।", "रात को वह सो नहीं पाया। उसे धीरू की धीमी चाल याद आई। उसे मिट्ठू की मीठी बोली याद आई। उसे लगा कि गाजरें तो हैं, पर घर सूना है।", "सुबह होते ही बंटू ने सारी गाजरें टोकरी में भरीं। वह दौड़ता हुआ दोस्तों के पास गया। \"लो, सब मिलकर खाओ!\" वह बोला। \"मैं बहुत बुरा दोस्त था। मुझे माफ़ कर दो।\"", "चीकू की आँखों में चमक आ गई। मिट्ठू ने पंख फड़फड़ाए। धीरू मुस्कुरा दिया। सबने मिलकर गाजरें खाईं। आज गाजरें पहले से भी मीठी लग रही थीं।", "फिर मिट्ठू ने कहा, \"बंटू, तुम्हारे खेत में पानी चाहिए।\" चीकू बोला, \"नदी से पानी लाना हमारा काम!\" धीरू बोला, \"मैं धीरे-धीरे ही सही, पर मटका उठाऊँगा।\"", "सब दोस्त रोज़ नदी से पानी लाने लगे। छोटे-छोटे मटकों से खेत भीगता रहा। कुछ दिनों में हरे पत्ते निकल आए। फिर गाजरें भी बड़ी होने लगीं।", "कुछ महीने बाद बारिश भी लौट आई। घाटी फिर हरी हो गई। बंटू का खेत लहलहा उठा। पर अब बंटू ने दरवाज़ा कभी बंद नहीं किया।", "हर शाम उसके खेत के पास दावत होती। सब मिलकर गाजरें खाते। सब हँसते और कहानियाँ सुनाते। बंटू को लगा कि वह दुनिया का सबसे अमीर खरगोश है।", "बाँटने से खुशी कम नहीं होती, दोगुनी हो जाती है।"] },
  { id: 3, cat: "seekh", title: "दीनू मोची का बटुआ", mins: "5-6", body: ["जयपुर के एक पुराने बाज़ार में दीनू मोची बैठता था। उसकी दुकान बस एक चटाई थी। चटाई पर कुछ कीलें, धागे और पुराने जूते पड़े रहते थे।", "दीनू दिन भर जूते सिलता और पॉलिश करता। शाम तक वह सौ-डेढ़ सौ रुपये कमा पाता। इसी में उसके घर का खर्चा चलता था। घर में पत्नी और दो छोटे बच्चे थे।", "एक सुबह दीनू दुकान लगा रहा था। तभी उसे चटाई के पास कुछ दिखा। वह एक मोटा भूरा बटुआ था। दीनू ने इधर-उधर देखा। आसपास कोई नहीं था।", "उसने बटुआ खोला। उसमें नोटों की मोटी गड्डी थी। साथ में कुछ कागज़ और एक फ़ोटो थी। दीनू की आँखें फटी रह गईं। इतने पैसे उसने कभी नहीं देखे थे।", "उसके मन में लालच जागा। \"इससे मेरे बच्चों की फ़ीस भर जाएगी,\" उसने सोचा। \"घर की छत भी ठीक हो जाएगी।\" उसने बटुआ अपनी थैली में रख लिया।", "पर पूरे दिन उसका मन काम में नहीं लगा। सुई उँगली में चुभ गई। धागा बार-बार उलझ गया। उसे लग रहा था कि कोई उसे देख रहा है।", "शाम को उसने बटुआ फिर खोला। कागज़ पर एक नाम और फ़ोन नंबर लिखा था। नाम था सेठ गिरधारी। दीनू के पास फ़ोन नहीं था। वह पास की दुकान पर गया।", "दुकानदार ने नंबर मिलाया। आगे से घबराई हुई आवाज़ आई। \"हाँ, मेरा बटुआ खो गया है। उसमें दुकान के मज़दूरों की तनख़्वाह थी!\" दीनू ने कहा, \"आप आ जाइए, बटुआ मेरे पास है।\"", "आधे घंटे में एक बूढ़े सेठ दौड़ते हुए आए। उनका चेहरा पसीने से भीगा था। दीनू ने बटुआ उनके हाथ में रख दिया। \"गिन लीजिए, सब पूरा है,\" वह बोला।", "सेठ ने नोट गिने। सब पूरे थे। उनकी आँखें भर आईं। \"बेटा, तुमने मेरे बीस मज़दूरों की दिवाली बचा दी,\" वे बोले।", "सेठ ने कुछ नोट निकालकर दीनू की ओर बढ़ाए। दीनू ने हाथ जोड़ लिए। \"नहीं सेठ जी, मैंने कुछ अलग नहीं किया।\" \"जो मेरा नहीं था, वह मैं कैसे रखता?\"", "सेठ मुस्कुराए। \"तो मैं इनाम नहीं, काम दूँगा।\" उन्होंने कहा, \"मेरी दुकान में सौ जोड़ी जूते हैं। उन्हें हर महीने सिलवाना और चमकाना होगा।\"", "दीनू को यक़ीन नहीं हुआ। सेठ ने उसके लिए दुकान के बाहर एक छोटी जगह दे दी। वहाँ छाँव थी और बारिश से बचाव भी। उन्होंने कहा, \"यह जगह तुम्हारी है, जब तक चाहो।\"", "कुछ ही दिनों में दीनू के पास रोज़ काम आने लगा। सेठ ने अपने जान-पहचान वालों को भी उसके बारे में बताया। लोग कहते, \"यह वही मोची है जिसने बटुआ लौटाया था।\" उसकी कमाई धीरे-धीरे बढ़ने लगी।", "एक साल में दीनू ने अपने बच्चों की फ़ीस भर दी। उसने अपने घर की छत भी ठीक करवाई। वह अब भी हर सुबह उसी तरह दुकान सजाता था। बस अब उसका मन हल्का रहता था।", "उसकी बेटी ने एक दिन पूछा, \"बाबा, आपको वे पैसे रख लेने का मन नहीं हुआ?\" दीनू हँस दिया। \"हुआ था बेटी, पर वह रात की नींद नहीं ख़रीद सकते।\"", "ईमानदारी का फल देर से मिल सकता है, पर वह हमेशा मीठा होता है।"] },
  { id: 4, cat: "parivar", title: "दादाजी की पुरानी घड़ी", mins: "5-6", body: ["इंदौर के एक पुराने मोहल्ले में दादाजी का घर था। उस घर में कभी बीस लोग रहते थे। आज वहाँ सिर्फ़ दादाजी और उनकी पुरानी दीवार घड़ी थी।", "दादाजी के दो बेटे थे, विनोद और प्रमोद। कई साल पहले ज़मीन के बँटवारे पर दोनों में झगड़ा हुआ। तब से दोनों ने बात करना बंद कर दिया। उनके बच्चे भी एक-दूसरे को नहीं जानते थे।", "दादाजी हर रविवार दोनों को फ़ोन करते। \"बेटा, एक बार घर आ जाओ,\" वे कहते। दोनों हर बार कोई बहाना बना देते। दादाजी चुपचाप फ़ोन रख देते।", "एक दिन दादाजी को तेज़ बुखार आ गया। पड़ोसी ने दोनों बेटों को खबर दी। विनोद सुबह पहुँचा। प्रमोद शाम को आया। दरवाज़े पर दोनों की नज़रें मिलीं, पर कोई नहीं बोला।", "दादाजी बिस्तर पर लेटे थे। उन्होंने दोनों को देखा और मुस्कुराए। \"आज मेरा घर भर गया,\" वे धीमे से बोले। दोनों बेटों की आँखें नम हो गईं।", "कुछ दिन में दादाजी ठीक होने लगे। विनोद दवा लाता, प्रमोद खाना बनवाता। दोनों एक-दूसरे से बचकर रहते। बस काम की बात करते। फिर भी दोनों घर में एक साथ थे।", "एक रात विनोद का बेटा आरव दादाजी के पास बैठा था। उसकी उम्र दस साल थी। उसने दीवार घड़ी की ओर देखा। \"दादाजी, यह घड़ी बंद क्यों है?\" उसने पूछा।", "दादाजी ने लंबी साँस ली। \"बेटा, यह घड़ी तब बंद हुई जब तुम्हारे पापा और चाचा लड़े थे।\" \"मैंने इसे फिर चलाया ही नहीं।\" \"सोचा, जब दोनों साथ बैठेंगे, तभी चलाऊँगा।\"", "आरव चुप रहा। उसने घड़ी को देखा। पीछे चाबी लगी थी। अगली सुबह उसने अपने चचेरे भाई तनु को बुलाया। तनु प्रमोद चाचा का बेटा था। दोनों पहली बार मिले थे।", "दोनों बच्चे घड़ी के पास खड़े हुए। आरव ने कहा, \"इसमें चाबी भरनी है।\" तनु बोला, \"पर चाबी तो ऊपर है।\" दोनों ने कुर्सी लगाई और मिलकर चाबी घुमाई।", "टिक... टिक... टिक... घड़ी चल पड़ी। इतने बरसों बाद उसकी आवाज़ पूरे घर में गूँज गई। विनोद और प्रमोद दौड़कर कमरे में आए। दोनों के कदम वहीं रुक गए।", "दादाजी बिस्तर पर बैठे थे। उनकी आँखों में आँसू थे। \"देखा, घड़ी तो बच्चों ने चला दी,\" वे बोले। \"तुम बड़े लोग कब चलोगे?\" कमरे में सन्नाटा छा गया।", "विनोद ने सिर झुका लिया। \"भैया, गलती मेरी भी थी,\" प्रमोद की आवाज़ भर्राई। विनोद बोला, \"नहीं छोटे, मैं ज़िद पर अड़ा रहा।\" दोनों भाई आगे बढ़े और गले लग गए।", "दादाजी ने आँखें पोंछीं। \"बस, मुझे यही चाहिए था।\" बच्चे तालियाँ बजाने लगे। रसोई से भाभियाँ भी आ गईं। सबने मिलकर चाय पी। बरसों बाद उस घर में हँसी गूँजी।", "उस दिन से घर में फिर रौनक लौट आई। हर रविवार सब परिवार वाले दादाजी के घर आते। आँगन में चटाई बिछती और खाना साथ बनता। घड़ी की टिक-टिक अब कभी नहीं रुकी।", "परिवार के रिश्ते घड़ी जैसे होते हैं, थोड़ी सी चाबी भरो तो फिर चल पड़ते हैं।"] },
  { id: 5, cat: "darawni", title: "बारह बजे की घंटी", mins: "5-6", body: ["निशा अपने दादाजी के पुराने घर में रहने अल्मोड़ा आई थी। घर पहाड़ी के ऊपर था। चारों तरफ़ देवदार के ऊँचे पेड़ थे। शाम होते ही कोहरा घर को घेर लेता था।", "घर में एक पुरानी घंटी थी। वह बैठक की दीवार पर टँगी थी। उसकी रस्सी सालों से कटी हुई थी। गाँव वाले कहते थे, \"उस घंटी को मत छेड़ना।\"", "पहली रात निशा देर तक पढ़ती रही। जब घड़ी ने बारह बजाए, तो नीचे से आवाज़ आई। टन... टन... टन... निशा के हाथ से किताब गिर गई। घंटी तो बिना रस्सी के थी।", "वह धीरे से सीढ़ियों से नीचे उतरी। बैठक में अँधेरा था। खिड़की से हल्की चाँदनी आ रही थी। घंटी बिल्कुल शांत टँगी थी। निशा ने सोचा, शायद हवा होगी।", "दूसरी रात फिर वही हुआ। ठीक बारह बजे घंटी बजी। इस बार निशा ने दरवाज़ा नहीं खोला। वह रज़ाई में दुबकी रही। पर उसे लगा, कोई कमरे के बाहर चल रहा है।", "सुबह उसने पड़ोस की बूढ़ी अम्मा से पूछा। अम्मा ने उसे गौर से देखा। \"बेटी, उस घर में पहले एक मास्टर जी रहते थे,\" वे बोलीं। \"वे रोज़ रात बारह बजे घंटी बजाते थे।\"", "\"किसलिए?\" निशा ने पूछा। अम्मा बोलीं, \"पहाड़ पर रात में लोग रास्ता भूल जाते हैं। मास्टर जी की घंटी सुनकर वे घर पहुँच जाते थे।\" \"उनके जाने के बाद घंटी चुप हो गई थी।\"", "निशा सोच में पड़ गई। क्या मास्टर जी की घंटी अब भी बजती है? उसे डर भी लग रहा था और जिज्ञासा भी। उसने तय किया कि आज रात वह जागकर देखेगी।", "रात को निशा बैठक में कुर्सी डालकर बैठ गई। उसके हाथ में टॉर्च थी। घड़ी की सुई बारह की ओर बढ़ रही थी। कोहरा खिड़की से अंदर झाँक रहा था।", "ठीक बारह बजे घंटी हिली। टन... टन... टन... निशा का दिल ज़ोर से धड़का। उसने टॉर्च जलाई। घंटी के पास कोई नहीं था। पर पीछे की दीवार में एक छोटा सा दरवाज़ा खुला हुआ था।", "निशा ने हिम्मत जुटाई। वह दरवाज़े के पास गई। अंदर एक छोटी सी कोठरी थी। वहाँ एक पुराना संदूक रखा था। उस पर धूल की मोटी परत जमी थी।", "उसने संदूक खोला। अंदर कुछ पुरानी चिट्ठियाँ थीं। साथ में एक फ़ोटो थी, जिसमें एक बुज़ुर्ग घंटी के पास खड़े थे। चिट्ठी में लिखा था, \"मेरे बाद भी घंटी बजती रहे।\"", "तभी बाहर से किसी की पुकार आई। \"कोई है? हम रास्ता भूल गए हैं!\" निशा दौड़कर बाहर गई। दो थके हुए यात्री कोहरे में खड़े थे। वे घंटी की आवाज़ सुनकर ऊपर चढ़ आए थे।", "निशा ने उन्हें अंदर बुलाया और चाय पिलाई। वे सुबह तक वहीं रुके। उन्होंने बताया कि घंटी की आवाज़ सुनकर ही वे सही रास्ते पर आए। निशा चुप रही। उसे समझ नहीं आया कि घंटी किसने बजाई थी।", "सुबह उसने घंटी को ध्यान से देखा। उसके नीचे एक पतला तार लगा था। वह तार किसी पुरानी चरखी से जुड़ा था। चरखी का सिरा हवा में हिल रहा था। शायद पहाड़ की हवा ही उसे घुमाती थी।", "निशा हँस पड़ी, पर उसके मन में अब भी सवाल था। फिर उसकी नज़र फ़ोटो पर पड़ी। फ़ोटो की मुस्कुराती आँखें जैसे उसी को देख रही थीं। उसने फ़ोटो को वापस संदूक में रख दिया।", "उस रात निशा ने घंटी में नई रस्सी बाँध दी। अब वह हर रात ठीक बारह बजे उसे खुद बजाती है। कोहरे में भटके लोग आज भी उसकी आवाज़ सुनकर घर पहुँचते हैं। और अजीब बात यह है कि अब कभी-कभी रस्सी बिना हाथ लगाए भी हिल जाती है।"] },
  { id: 6, cat: "prem", title: "किताब के बीच की चिट्ठी", mins: "5-6", body: ["कोलकाता की एक पुरानी लाइब्रेरी में तन्मय रोज़ पढ़ने आता था। वह खिड़की के पास वाली मेज़ पर बैठता था। वहाँ से बाहर की बारिश साफ़ दिखती थी। उसे वह जगह बहुत पसंद थी।", "एक दिन उसने एक पुरानी कविता की किताब उठाई। पन्ने पलटते हुए उसमें से एक पर्ची गिरी। उस पर गोल अक्षरों में लिखा था, \"जो इसे पढ़े, उसे मेरी तरफ़ से नमस्ते।\" तन्मय मुस्कुरा दिया।", "उसके मन में शरारत आई। उसने उसी पर्ची के नीचे लिखा, \"नमस्ते। आपकी पसंद की किताब अच्छी है।\" फिर उसने पर्ची किताब में रखकर किताब अलमारी में लौटा दी। उसे लगा, यह बात यहीं ख़त्म हो जाएगी।", "दो दिन बाद वह फिर लाइब्रेरी गया। उसने वही किताब खोली। पर्ची अब भी वहीं थी। नीचे एक नई लाइन लिखी थी। \"शुक्रिया! आपको कौन सी कविता सबसे अच्छी लगी?\" तन्मय का दिल हल्का सा धड़क गया।", "अब यह रोज़ का सिलसिला बन गया। वह एक लाइन लिखता, कोई दूसरी लाइन जोड़ता। कभी बारिश की बात होती, कभी चाय की। कभी किसी पुरानी किताब की। दोनों एक-दूसरे का नाम तक नहीं जानते थे।", "तन्मय अब लाइब्रेरी जल्दी आने लगा। वह हर किसी को ध्यान से देखता। कौन होगी वह? खिड़की के पास वाली लड़की? या किताबें सँभालने वाली? उसे कुछ समझ नहीं आता था।", "एक दिन पर्ची पर लिखा मिला, \"अगर आपको बुरा न लगे, तो कल शाम चार बजे बाहर चाय की दुकान पर मिलें?\" तन्मय की उँगलियाँ काँप गईं। उसने जवाब में बस एक शब्द लिखा, \"ज़रूर।\"", "अगले दिन वह बहुत घबराया हुआ था। उसने नई कमीज़ पहनी। बाल सँवारे। चाय की दुकान पर वह तीन बजे ही पहुँच गया। बारिश की बूँदें टीन की छत पर बज रही थीं।", "ठीक चार बजे एक लड़की छाता लिए आई। उसकी आँखों में बड़ी सी चमक थी। उसके हाथ में वही कविता की किताब थी। वह तन्मय के पास आकर रुकी। \"शायद आप ही हैं?\" उसने पूछा।", "\"शायद,\" तन्मय हँस दिया। \"मेरा नाम तन्मय है।\" लड़की बोली, \"मैं इरा।\" दोनों कुछ पल चुप रहे। फिर दोनों ज़ोर से हँस पड़े। जिनसे इतने दिन बात की थी, वे आज पहली बार मिल रहे थे।", "उन्होंने साथ चाय पी। इरा ने बताया कि वह रोज़ पर्ची लिखकर जाती थी। वह रोज़ सोचती थी कि कोई जवाब देगा या नहीं। तन्मय ने कहा, \"मैं भी रोज़ यही सोचता था कि आप कौन हैं।\"", "उस शाम वे देर तक बातें करते रहे। बारिश थम गई थी, पर उनकी बातें नहीं थमीं। इरा को कविताएँ पसंद थीं। तन्मय को कहानियाँ। दोनों को एक-दूसरे की पसंद अच्छी लगी।", "अब वे हफ़्ते में कई बार मिलने लगे। कभी लाइब्रेरी में, कभी चाय की दुकान पर। कभी साथ बैठकर किताबें पढ़ते। पर्ची वाला सिलसिला भी चलता रहा। बस अब पर्चियों में नाम लिखे होते थे।", "एक साल बाद तन्मय ने इरा को वही किताब तोहफ़े में दी। उसके आख़िरी पन्ने पर एक नई पर्ची रखी थी। उस पर लिखा था, \"क्या आप ज़िंदगी भर मेरी पर्ची का जवाब देंगी?\" इरा की आँखें भर आईं। उसने पर्ची के नीचे लिखा, \"हमेशा।\"", "कभी-कभी सबसे सुंदर रिश्ते एक छोटी सी पर्ची से शुरू होते हैं।"] },
  { id: 7, cat: "hasya", title: "सरपंच जी की बकरी और भाषण", mins: "5-6", body: ["हरियाणा के गाँव सिसाना में रामलाल सरपंच बहुत रौबदार आदमी थे। वे हर बात पर भाषण देते थे। बारिश आए तो भाषण। सूखा पड़े तो भाषण। चाय ठंडी हो जाए तो भी भाषण।", "गाँव वाले उनके भाषणों से थक चुके थे। पर सरपंच जी को इसकी ख़बर नहीं थी। वे समझते थे कि सब उनके दीवाने हैं। हर भाषण से पहले वे ज़ोर से खाँसते थे। यह उनकी पहचान थी।", "सरपंच जी की एक बकरी थी, जिसका नाम रानी था। रानी बड़ी शैतान थी। वह किसी भी चीज़ को चबा जाती थी। चप्पल हो, थैला हो या अख़बार। सरपंच जी उसे बहुत मानते थे।", "एक दिन गाँव में बड़ा मेला लगना था। सरपंच जी को उद्घाटन का भाषण देना था। उन्होंने तीन दिन से तैयारी की थी। भाषण पूरे पाँच पन्नों का लिखा था।", "मेले की सुबह उन्होंने नया कुर्ता पहना। भाषण के पन्ने जेब में रखे। मूँछों पर ताव दिया और चल पड़े। रास्ते में उन्हें पुराना दोस्त मिल गया। वे बातों में ऐसे खोए कि जेब का ध्यान ही नहीं रहा।", "मंच के पास पहुँचकर उन्होंने गला साफ़ किया। \"भाइयो और बहनो!\" वे बोले। उन्होंने जेब में हाथ डाला। जेब खाली थी। उनका चेहरा पीला पड़ गया। पन्ने कहाँ गए?", "भीड़ में कानाफूसी होने लगी। सरपंच जी इधर-उधर देखने लगे। तभी भीड़ के पीछे से हँसी की आवाज़ आई। सबने पलटकर देखा। रानी बकरी मुँह में काग़ज़ चबाती हुई चली आ रही थी।", "उसके मुँह से भाषण के पन्ने लटक रहे थे। एक पन्ना उसके कान पर चिपका था। रानी मस्ती से मेरी-मेरी करती सरपंच जी की ओर आई। पूरी भीड़ हँसी से लोटपोट हो गई।", "सरपंच जी का चेहरा लाल हो गया। वे चिल्लाए, \"रानी, यह क्या किया?\" रानी ने एक और पन्ना निगल लिया। एक बच्चा ज़ोर से बोला, \"बकरी भी भाषण पढ़ना चाहती है!\" इस पर तो सब हँसते-हँसते गिर पड़े।", "सरपंच जी ने सोचा, अब क्या करें? उन्हें भाषण याद नहीं था। उन्होंने माइक पकड़ा और खाँसा। \"भाइयो, मेरा भाषण तो बकरी खा गई।\" \"इसलिए आज का भाषण... बस इतना ही।\"", "एक पल को सन्नाटा रहा। फिर भीड़ ने ज़ोरदार तालियाँ बजाईं। लोग चिल्लाए, \"वाह सरपंच जी, आज तक का सबसे अच्छा भाषण!\" सरपंच जी हक्के-बक्के रह गए। उन्हें पहली बार इतनी तालियाँ मिली थीं।", "उसी दिन से गाँव में रानी का नाम हो गया। लोग उसे \"भाषण वाली बकरी\" कहने लगे। बच्चे उसके लिए रोटी लाते। कोई कहता, \"रानी जी, आज सरपंच जी को भाषण मत खाने देना!\"", "अगली बार सरपंच जी ने भाषण दिया, तो सिर्फ़ दो मिनट का। उन्होंने सोचा, लंबा बोलूँगा तो कहीं रानी फिर न आ जाए। गाँव वाले खुश हो गए। अब मेलों में उनकी सबसे ज़्यादा माँग थी।", "एक दिन गाँव के मास्टर जी ने उनसे पूछा, \"सरपंच जी, आज भाषण छोटा क्यों?\" सरपंच जी ने मूँछों पर हाथ फेरा। \"जब से रानी ने सबक सिखाया है, अब बात छोटी और असरदार करता हूँ।\" रानी पीछे से मुँह चलाती हुई मेरी-मेरी करने लगी।", "गाँव में आज भी लोग यह किस्सा सुनाकर खूब हँसते हैं। और रानी? वह आज भी सरपंच जी के कुर्ते की जेब पर नज़र रखती है।", "कभी-कभी कम बोलना ही सबसे अच्छा भाषण होता है।"] },
  { id: 8, cat: "sangharsh", title: "शोभा का टिफ़िन", mins: "5-6", body: ["पुणे की एक तंग गली में शोभा अपने दो बच्चों के साथ रहती थी। उसके पति की नौकरी अचानक चली गई थी। फिर वे बीमार पड़े और कुछ महीनों में चल बसे। घर में उदासी छा गई थी।", "शोभा ज़्यादा पढ़ी-लिखी नहीं थी। उसे बस खाना बनाना आता था। पर घर का किराया देना था। बच्चों की फ़ीस भरनी थी। उसने कई जगह काम माँगा, पर हर जगह मना हो गया।", "एक दिन शोभा बाज़ार गई। वहाँ उसने कुछ मज़दूरों को दुकान के बाहर रोटी खाते देखा। वे सूखी रोटी और अचार खा रहे थे। शोभा के मन में एक ख़याल आया। क्यों न इन्हें घर का खाना बनाकर दूँ?", "उसने अपनी पुरानी बालियाँ बेच दीं। उन पैसों से कुछ आटा, दाल और सब्ज़ियाँ ख़रीदीं। अगले दिन सुबह चार बजे से उसने खाना बनाया। उसने दस डिब्बे तैयार किए। फिर वह उन्हें लेकर बाज़ार पहुँची।", "पहले दिन सिर्फ़ तीन डिब्बे बिके। शोभा उदास हो गई। बाकी खाना उसने घर लाकर बच्चों को खिला दिया। रात को वह सोचती रही, क्या यह काम चलेगा? पर उसके पास और कोई रास्ता नहीं था।", "अगले दिन उसने फिर वही किया। इस बार उसने खाने में थोड़ा घर जैसा स्वाद डाला। रोटियाँ गरम और मुलायम रखीं। एक मज़दूर ने डिब्बा खाया और बोला, \"बहन, यह तो माँ के हाथ का खाना है!\" शोभा की आँखें नम हो गईं।", "धीरे-धीरे लोग उसे पहचानने लगे। पाँच डिब्बे बिके, फिर दस। कुछ हफ़्तों में पंद्रह। शोभा सुबह तीन बजे उठती थी। हाथों में छाले पड़ गए थे। पर वह रुकी नहीं।", "कुछ महीने बाद बारिश का मौसम आया। एक दिन पूरे शहर में पानी भर गया। शोभा की गली डूब गई। उसका चूल्हा बुझ गया और सारा सामान भीग गया। उस दिन वह फूट-फूटकर रोई।", "उसके बेटे ने उसका हाथ पकड़ा। \"माँ, हम फिर शुरू करेंगे,\" उसने कहा। \"मैं भी आपके साथ काम करूँगा।\" शोभा ने बेटे को गले लगा लिया। उसे लगा, उसके पास आज भी हिम्मत है।", "अगली सुबह माँ और बेटे ने मिलकर चूल्हा सुखाया। पड़ोसी भी मदद को आए। किसी ने लकड़ी दी, किसी ने आटा। देखते-देखते रसोई फिर चल पड़ी। उस दिन भी बीस डिब्बे बिके।", "एक साल में शोभा के पास पचास ग्राहक हो गए। उसने दो और औरतों को काम पर रखा। जिनके पास काम नहीं था, उन्हें रोज़गार दिया। उसकी रसोई अब एक छोटा कारोबार बन चुकी थी।", "बेटी स्कूल में पढ़ने लगी। बेटे ने खाना पहुँचाने का काम सँभाल लिया। घर का किराया समय पर जाने लगा। शोभा ने पैसे जोड़कर एक छोटी सी दुकान किराए पर ली। उस पर उसने बोर्ड लगाया, \"शोभा का टिफ़िन।\"", "पहले दिन दुकान के सामने पूरा मोहल्ला जुटा। जिन लोगों ने कभी उसे मना किया था, वे भी आए। उन्होंने मिठाई खाई और बधाई दी। शोभा सबके सामने हाथ जोड़कर खड़ी रही।", "रात को वह अपने पति की तस्वीर के पास बैठी। उसने धीरे से कहा, \"देखो, मैंने सँभाल लिया।\" तस्वीर में पति मुस्कुरा रहे थे। बाहर गली में बच्चे खेल रहे थे। पहली बार शोभा के घर में चैन की नींद आई।", "जब सारे रास्ते बंद लगें, तब मेहनत और हिम्मत खुद एक नया रास्ता बना देती है।"] },
  { id: 9, cat: "prerak", title: "आखिरी कोशिश", mins: "1-2", body: ["एक छोटे गाँव में मोहन नाम का लड़का रहता था। वह पढ़ाई में कमजोर था। हर परीक्षा में कम अंक आने के कारण लोग उसका मजाक उड़ाते थे।", "एक दिन उसके शिक्षक ने कहा, \"हारने वाला वह नहीं होता जो गिर जाता है, हारने वाला वह होता है जो उठने की कोशिश छोड़ देता है।\"", "यह बात मोहन के दिल में बैठ गई। उसने रोज थोड़ा-थोड़ा पढ़ना शुरू किया। शुरुआत में उसे बहुत मुश्किल हुई, लेकिन उसने हार नहीं मानी।", "कुछ महीनों बाद परीक्षा का परिणाम आया। इस बार मोहन पूरे स्कूल में प्रथम आया।", "उस दिन उसने अपने शिक्षक से कहा, \"सर, मेरी जिंदगी आपकी उस एक बात ने बदल दी।\"", "सीख: सफलता एक दिन में नहीं मिलती, लेकिन लगातार कोशिश करने से रास्ता जरूर मिलता है।"] },
  { id: 10, cat: "seekh", title: "ईमानदार लकड़हारा", mins: "1-2", body: ["रामू जंगल में लकड़ियाँ काटकर अपना परिवार चलाता था। एक दिन नदी के किनारे पेड़ काटते समय उसकी कुल्हाड़ी नदी में गिर गई।", "वह परेशान होकर रोने लगा। तभी एक बुजुर्ग व्यक्ति वहाँ आए और उन्होंने उसकी मदद करने का फैसला किया।", "वे नदी में गए और सोने की कुल्हाड़ी लेकर बाहर आए। रामू ने कहा, \"यह मेरी नहीं है।\"", "फिर वे चाँदी की कुल्हाड़ी लेकर आए। रामू ने उसे भी मना कर दिया।", "आखिर में वे लोहे की पुरानी कुल्हाड़ी लेकर आए। रामू खुशी से बोला, \"हाँ, यही मेरी कुल्हाड़ी है!\"", "उसकी ईमानदारी देखकर बुजुर्ग ने उसे तीनों कुल्हाड़ियाँ दे दीं।", "सीख: ईमानदारी का फल हमेशा अच्छा होता है।"] },
  { id: 11, cat: "bachche", title: "नन्हा दीपक", mins: "1-2", body: ["एक गाँव में रात के समय बिजली चली गई। पूरा गाँव अंधेरे में डूब गया।", "एक छोटी बच्ची रानी ने अपने घर में रखा छोटा-सा दीपक जलाया। उसकी रोशनी देखकर पड़ोस की दादी अपने घर से बाहर आईं।", "फिर एक पड़ोसी ने भी दीपक जलाया। धीरे-धीरे कई घरों में रोशनी हो गई।", "रानी की माँ ने पूछा, \"तुम्हारे छोटे से दीपक से क्या बदल गया?\"", "रानी बोली, \"माँ, मेरा दीपक पूरा गाँव तो रोशन नहीं कर सकता, लेकिन किसी को शुरुआत तो करनी होगी।\"", "माँ ने बेटी को प्यार से समझाया कि छोटी कोशिश भी बड़ा बदलाव ला सकती है।", "सीख: बदलाव की शुरुआत हमेशा एक छोटी कोशिश से होती है।"] },
  { id: 12, cat: "parivar", title: "पिता की पुरानी घड़ी", mins: "1-2", body: ["अमन को अपने पिता की पुरानी घड़ी बिल्कुल पसंद नहीं थी। वह हमेशा नई और महँगी चीजों की माँग करता था।", "एक दिन उसके पिता ने उसे घड़ी देते हुए कहा, \"यह घड़ी मेरे पिता ने मुझे दी थी। अब मैं इसे तुम्हें देना चाहता हूँ।\"", "अमन ने घड़ी रख तो ली, लेकिन उसकी अहमियत नहीं समझी।", "कुछ साल बाद जब उसके पिता उसके साथ नहीं रहे, तब उसे वह घड़ी बहुत प्यारी लगने लगी।", "अब वह घड़ी समय बताने से ज्यादा उसे अपने पिता की याद दिलाती थी।", "उसने समझा कि कुछ चीजों की कीमत पैसों से नहीं, उनसे जुड़ी यादों से होती है।", "सीख: अपनों की दी हुई छोटी चीजों की भी कद्र करनी चाहिए।"] },
  { id: 13, cat: "darawni", title: "बंद कमरे की आवाज", mins: "1-2", body: ["एक पुराने मकान में राहुल अपने परिवार के साथ रहने आया। मकान की ऊपरी मंजिल पर एक कमरा हमेशा बंद रहता था।", "हर रात उस कमरे से धीमी आवाज सुनाई देती थी। राहुल ने कई बार घरवालों से पूछा, लेकिन किसी ने उसे साफ जवाब नहीं दिया।", "एक दिन घर की सफाई करते समय उसे उस कमरे की पुरानी चाबी मिल गई।", "उसने दरवाजा खोला तो अंदर पुराना रेडियो चल रहा था। रेडियो में एक कार्यक्रम अपने आप चालू हो जाता था, क्योंकि उसका टाइमर खराब था।", "राहुल ने रेडियो बंद किया और कमरे को साफ कर दिया।", "अब रात में वहाँ कोई आवाज नहीं आती थी।", "सीख: हर अनजान आवाज के पीछे कोई रहस्य नहीं होता, कभी-कभी उसका साधारण कारण भी होता है।"] },
  { id: 14, cat: "seekh", title: "लालची दुकानदार", mins: "1-2", body: ["एक दुकानदार हमेशा अपने ग्राहकों को कम सामान देकर ज्यादा पैसे लेता था।", "एक दिन एक बुजुर्ग महिला उसकी दुकान पर आईं। उन्होंने कुछ अनाज खरीदा और पैसे देकर चली गईं।", "दुकानदार को पता चला कि महिला गलती से ज्यादा पैसे दे गई हैं। वह खुश हो गया और पैसे अपनी जेब में रख लिए।", "कुछ दिनों बाद दुकान में चोरी हो गई। दुकानदार को बहुत नुकसान हुआ।", "तभी उसे अपनी गलती याद आई। उसने तय किया कि अब वह किसी के साथ बेईमानी नहीं करेगा।", "धीरे-धीरे उसने ईमानदारी से काम करना शुरू किया और लोगों का भरोसा वापस पाया।", "सीख: लालच से थोड़े समय का फायदा मिलता है, लेकिन ईमानदारी से लंबे समय का विश्वास मिलता है।"] },
  { id: 15, cat: "bachche", title: "चतुर खरगोश", mins: "1-2", body: ["एक जंगल में एक खरगोश और एक शेर रहते थे। शेर रोज जंगल के जानवरों को परेशान करता था।", "एक दिन खरगोश ने सभी जानवरों को बचाने की योजना बनाई।", "वह शेर के पास देर से पहुँचा। शेर गुस्से में बोला, \"इतनी देर क्यों हुई?\"", "खरगोश ने कहा, \"महाराज, रास्ते में एक दूसरा शेर मुझे रोक रहा था। वह कहता है कि वही इस जंगल का राजा है।\"", "शेर गुस्से से बोला, \"मुझे उसके पास ले चलो!\"", "खरगोश उसे एक पुराने कुएँ के पास ले गया। शेर ने कुएँ में झाँका तो उसे अपनी ही परछाईं दिखाई दी।", "वह अपनी परछाईं पर दहाड़ने लगा और अपनी ही आवाज की गूँज सुनकर घबरा गया।", "इस तरह खरगोश ने अपनी बुद्धि से जंगल के जानवरों को बचा लिया।", "सीख: मुश्किल समय में बुद्धि और धैर्य ताकत से अधिक काम आते हैं।"] },
  { id: 16, cat: "parivar", title: "माँ का अधूरा सपना", mins: "1-2", body: ["सीमा की माँ चाहती थीं कि उनकी बेटी पढ़-लिखकर अपने पैरों पर खड़ी हो। लेकिन परिवार की आर्थिक स्थिति अच्छी नहीं थी।", "माँ दिनभर काम करतीं और रात में बेटी की पढ़ाई के लिए समय निकालतीं।", "सीमा भी अपनी माँ की मेहनत समझती थी। वह रोज मन लगाकर पढ़ती।", "कई साल बाद सीमा को एक अच्छे विद्यालय में शिक्षक की नौकरी मिल गई।", "पहले दिन वह अपनी माँ को स्कूल लेकर गई और बोली, \"माँ, आज आपका सपना पूरा हो गया।\"", "माँ की आँखों में खुशी के आँसू आ गए।", "सीख: माता-पिता के सपनों को पूरा करने का सबसे अच्छा रास्ता मेहनत और शिक्षा है।"] },
  { id: 17, cat: "sangharsh", title: "आखिरी बस", mins: "1-2", body: ["एक छोटे शहर में दीपक रोज नौकरी की तलाश में निकलता था। कई दिनों तक उसे कोई काम नहीं मिला।", "एक शाम वह बस स्टैंड पर बैठा था। उसकी जेब में घर लौटने के लिए केवल बस का किराया बचा था।", "तभी उसने देखा कि एक बुजुर्ग व्यक्ति सड़क पार करने में परेशान हो रहे हैं। दीपक ने उनकी मदद की।", "बुजुर्ग व्यक्ति ने बातचीत में बताया कि उन्हें अपनी दुकान के लिए एक भरोसेमंद सहायक चाहिए।", "दीपक ने काम माँगा। बुजुर्ग ने उसे अगले दिन दुकान पर आने को कहा।", "अगले दिन दीपक वहाँ पहुँचा और उसे नौकरी मिल गई।", "उस दिन उसने जाना कि कभी-कभी अच्छे अवसर हमारी उम्मीद से अलग रास्ते से आते हैं।", "सीख: कोशिश जारी रखिए और इंसानियत कभी मत छोड़िए।"] },
  { id: 18, cat: "bachche", title: "पेड़ का बदला", mins: "1-2", body: ["एक गाँव में एक बड़ा आम का पेड़ था। गर्मियों में बच्चे उसकी छाया में खेलते और यात्री आराम करते थे।", "एक दिन एक लकड़हारा उस पेड़ को काटने आया।", "गाँव के बच्चों ने उसे रोककर कहा, \"यह पेड़ हमें फल देता है, छाया देता है और पक्षियों को घर देता है। इसे मत काटिए।\"", "लकड़हारे ने बच्चों की बात सुनी और पेड़ काटने का फैसला बदल दिया।", "बच्चों ने मिलकर उस पेड़ के आसपास और पौधे लगाए।", "कुछ वर्षों बाद वहाँ एक सुंदर बगीचा बन गया।", "सीख: प्रकृति की रक्षा करना हम सभी की जिम्मेदारी है।"] },
  { id: 19, cat: "hasya", title: "खाली बटुआ", mins: "1-2", body: ["एक दिन पप्पू बाजार गया। उसने अपनी जेब से बटुआ निकाला तो उसमें एक भी रुपया नहीं था।", "वह घबराकर बोला, \"अरे! मेरा बटुआ खाली कैसे हो गया?\"", "उसके दोस्त ने कहा, \"तुमने कल ही तो सारी खरीदारी की थी।\"", "पप्पू बोला, \"हाँ, लेकिन मैंने तो सोचा था कि पैसे खुद ही वापस आ जाएँगे!\"", "दोस्त हँसकर बोला, \"अगर ऐसा होता तो दुनिया में कोई काम ही नहीं करता।\"", "पप्पू ने सिर खुजलाया और बोला, \"तो फिर मुझे अपनी खर्च करने की आदत बदलनी पड़ेगी।\"", "सीख: पैसे कमाने के साथ उन्हें समझदारी से खर्च करना भी जरूरी है।"] },
  { id: 20, cat: "darawni", title: "पुरानी हवेली का मेहमान", mins: "1-2", body: ["एक गाँव के बाहर एक पुरानी हवेली थी। लोग कहते थे कि वहाँ रात में किसी के चलने की आवाज आती है।", "एक दिन एक यात्री रास्ता भटक गया और रात होने पर हवेली के पास पहुँच गया।", "उसने दरवाजा खटखटाया। अंदर से कोई जवाब नहीं आया।", "वह हिम्मत करके अंदर गया। तभी ऊपर की मंजिल से कदमों की आवाज सुनाई दी।", "उसने ऊपर जाकर देखा तो एक बूढ़ा चौकीदार बैठा था।", "चौकीदार ने बताया कि वह वर्षों से हवेली की देखभाल करता है और रात में लकड़ी की सीढ़ियाँ आवाज करती हैं।", "यात्री को राहत मिली। उसने चौकीदार के साथ रात बिताई और सुबह अपने रास्ते निकल गया।", "सीख: किसी बात पर विश्वास करने से पहले उसकी सच्चाई जानना जरूरी है।"] },
  { id: 21, cat: "prerak", title: "दोस्ती की असली पहचान", mins: "1-2", body: ["रवि और सुमित बचपन के दोस्त थे। दोनों हमेशा साथ रहते थे।", "एक दिन रवि की दुकान में नुकसान हो गया। उसके कई परिचित उससे दूर होने लगे।", "लेकिन सुमित रोज उससे मिलने आता और उसकी मदद करता।", "कुछ महीनों बाद रवि ने फिर से अपना काम शुरू किया और सफलता हासिल की।", "उसने सुमित से कहा, \"जब सबने मेरा साथ छोड़ दिया था, तब तुम मेरे साथ थे।\"", "सुमित बोला, \"दोस्ती सिर्फ अच्छे समय में साथ रहने का नाम नहीं है।\"", "रवि समझ गया कि सच्चे रिश्तों की पहचान मुश्किल समय में होती है।", "सीख: सच्चा दोस्त वही है जो कठिन समय में आपका साथ न छोड़े।"] },
  { id: 22, cat: "sangharsh", title: "मेहनत का फल", mins: "1-2", body: ["किशन एक किसान था। वह हर साल अपने खेत में मेहनत करता, लेकिन कभी बारिश कम होती तो कभी फसल खराब हो जाती।", "एक साल उसने खेत में नई फसल लगाने का फैसला किया।", "उसने कृषि विशेषज्ञ से सलाह ली और खेती के नए तरीके सीखे।", "शुरुआत में गाँव के लोग उसका मजाक उड़ाते थे।", "लेकिन किशन ने धैर्य रखा। इस बार उसकी फसल अच्छी हुई और उसे पहले से ज्यादा कमाई मिली।", "अब गाँव के दूसरे किसान भी उससे सलाह लेने आने लगे।", "सीख: नई चीजें सीखने और मेहनत करने से मुश्किल परिस्थितियाँ बदली जा सकती हैं।"] },
  { id: 23, cat: "parivar", title: "दादी की छोटी पोटली", mins: "1-2", body: ["एक दिन रोहन अपनी दादी के कमरे की सफाई कर रहा था। उसे एक छोटी पोटली मिली।", "उसने पोटली खोली तो उसमें पुराने पत्र, कुछ तस्वीरें और एक छोटी सी चिट्ठी थी।", "चिट्ठी में दादी ने लिखा था कि जिंदगी में धन से ज्यादा महत्वपूर्ण परिवार का प्यार और एक-दूसरे का सम्मान है।", "रोहन ने दादी से पूछा, \"आपने ये सब संभालकर क्यों रखा है?\"", "दादी बोलीं, \"क्योंकि इन चीजों में मेरी पूरी जिंदगी की यादें हैं।\"", "रोहन ने पोटली वापस रख दी और दादी के साथ बैठकर पुरानी यादें सुनने लगा।", "सीख: परिवार के साथ बिताया समय सबसे कीमती यादों में बदल जाता है।"] },
  { id: 24, cat: "bachche", title: "समझदार बंदर", mins: "1-2", body: ["एक जंगल में एक बंदर रहता था। वह हमेशा दूसरे जानवरों की नकल करता था।", "एक दिन उसने हाथी को नदी में नहाते देखा। बंदर भी नदी में कूद गया, लेकिन उसे तैरना नहीं आता था।", "वह घबरा गया और मदद के लिए चिल्लाने लगा।", "पास खड़े कछुए ने उसे सुरक्षित बाहर निकाला।", "कछुए ने कहा, \"किसी की नकल करने से पहले अपनी क्षमता समझनी चाहिए।\"", "बंदर को अपनी गलती समझ आ गई। उसने फैसला किया कि अब वह पहले सीखेगा और फिर कोई नया काम करेगा।", "सीख: बिना सोचे दूसरों की नकल करना नुकसानदायक हो सकता है।"] },
  { id: 25, cat: "seekh", title: "दो रोटियों की कीमत", mins: "1-2", body: ["एक दिन एक गरीब आदमी बाजार में बैठा था। उसके पास खाना खरीदने के पैसे नहीं थे।", "एक दुकानदार ने उसे देखा और दो रोटियाँ दे दीं।", "आदमी ने धन्यवाद कहा और खाना खाकर चला गया।", "कुछ दिनों बाद दुकानदार की दुकान में आग लग गई। वह परेशान होकर सड़क पर बैठा था।", "तभी वही गरीब आदमी वहाँ आया। उसने दुकानदार को पहचान लिया और गाँव के लोगों को बुलाकर मदद करने लगा।", "सबने मिलकर दुकान का सामान बचा लिया।", "दुकानदार ने कहा, \"आज तुमने मेरी मदद करके मेरा उपकार चुका दिया।\"", "आदमी बोला, \"अच्छाई का हिसाब नहीं रखा जाता।\"", "सीख: छोटी-सी मदद भी किसी के जीवन में बड़ा बदलाव ला सकती है।"] },
  { id: 26, cat: "prerak", title: "खाली मैदान का सपना", mins: "1-2", body: ["एक गाँव में बच्चों के खेलने के लिए कोई मैदान नहीं था। वे सड़क पर खेलते थे और अक्सर परेशान होते थे।", "गाँव के एक बच्चे ने सोचा कि क्यों न खाली पड़ी जमीन को खेल के मैदान में बदल दिया जाए।", "उसने अपने दोस्तों के साथ मिलकर गाँव के बुजुर्गों से बात की।", "सभी ने मिलकर सफाई की और जमीन को खेलने लायक बनाया।", "कुछ ही दिनों में वहाँ बच्चे खेलने लगे।", "जिस बच्चे ने यह विचार शुरू किया था, वह बहुत खुश था।", "सीख: अच्छा विचार तभी सफल होता है जब उसके लिए मिलकर काम किया जाए।"] },
  { id: 27, cat: "sangharsh", title: "बूढ़ा घोड़ा", mins: "1-2", body: ["एक किसान के पास एक बूढ़ा घोड़ा था। अब वह पहले की तरह तेज नहीं दौड़ सकता था।", "किसान ने सोचा कि घोड़ा अब उसके किसी काम का नहीं है।", "एक दिन किसान का छोटा बेटा रास्ता भटक गया। वह शाम तक घर नहीं लौटा।", "किसान बहुत परेशान हुआ। बूढ़ा घोड़ा बार-बार एक दिशा में जाने की कोशिश कर रहा था।", "किसान उसके पीछे गया। घोड़ा उसे एक पुराने रास्ते से जंगल के पास ले गया, जहाँ उसका बेटा सुरक्षित बैठा था।", "किसान को समझ आया कि उम्र बढ़ने से किसी की उपयोगिता खत्म नहीं होती।", "सीख: किसी की कीमत केवल उसकी ताकत या उम्र से नहीं आँकनी चाहिए।"] },
  { id: 28, cat: "prerak", title: "एक नई सुबह", mins: "1-2", body: ["अर्जुन कई सालों से अपना छोटा व्यवसाय शुरू करना चाहता था। लेकिन असफल होने के डर से वह हर बार अपना फैसला बदल देता था।", "एक दिन उसके पिता ने उससे पूछा, \"तुम्हें सबसे ज्यादा डर किस बात का है?\"", "अर्जुन बोला, \"अगर मेरा काम नहीं चला तो?\"", "पिता ने कहा, \"अगर तुम कोशिश ही नहीं करोगे तो तुम्हें कभी पता भी नहीं चलेगा कि तुम क्या कर सकते थे।\"", "अर्जुन ने छोटे स्तर से अपना काम शुरू किया। शुरुआत में उसे कम ग्राहक मिले, लेकिन उसने काम की गुणवत्ता पर ध्यान दिया।", "धीरे-धीरे लोगों का भरोसा बढ़ा और उसका व्यवसाय आगे बढ़ने लगा।", "अर्जुन ने समझ लिया कि सफलता पाने के लिए शुरुआत करना सबसे जरूरी है।", "सीख: सही समय का इंतजार करते रहने के बजाय छोटी शुरुआत करना बेहतर है।"] },
  { id: 29, cat: "prerak", title: "साइकिल वाली लड़की", mins: "1-2", body: ["काव्या के गाँव में आठवीं के बाद स्कूल नहीं था। पास का स्कूल दस किलोमीटर दूर था। कई लोगों ने कहा, \"लड़की इतनी दूर कैसे जाएगी? पढ़ाई छोड़ दे।\"", "काव्या ने पुरानी साइकिल ठीक करवाई और रोज सुबह निकलने लगी। बारिश में रास्ता कीचड़ से भर जाता, फिर भी वह रुकी नहीं।", "धीरे-धीरे गाँव की और लड़कियाँ भी उसके साथ जाने लगीं। अब सुबह सड़क पर साइकिलों की कतार दिखती थी।", "सालों बाद काव्या डॉक्टर बनी और अपने गाँव में ही क्लिनिक खोला।", "सीख: अगर इरादा मजबूत हो तो दूरी और मुश्किलें रास्ता नहीं रोक पातीं।"] },
  { id: 30, cat: "seekh", title: "सच का सिक्का", mins: "1-2", body: ["आठ साल के गोलू को बाजार में एक बटुआ मिला। उसमें कई नोट थे। उसके दोस्त बोले, \"चुपचाप रख ले, किसी को पता नहीं चलेगा।\"", "गोलू का मन ललचाया, लेकिन उसे अपनी माँ की बात याद आई, \"जो चीज तुम्हारी नहीं, उस पर तुम्हारा हक नहीं।\"", "वह बटुआ लेकर दुकानदारों से पूछने लगा। थोड़ी देर में एक परेशान बुजुर्ग आए, जो अपने बटुए को ढूँढ रहे थे।", "उन्होंने बटुआ पाकर गोलू को गले लगा लिया और उसे मिठाई खिलाई।", "सीख: सच्चाई का इनाम पैसों से भी बड़ा होता है।"] },
  { id: 31, cat: "bachche", title: "नन्ही गिलहरी का खजाना", mins: "1-2", body: ["सर्दियाँ आने वाली थीं। जंगल में नन्ही गिलहरी चुनमुन रोज मेवे और दाने इकट्ठे कर रही थी। बाकी जानवर खेलते रहते और उस पर हँसते।", "चुनमुन बोली, \"आज की मेहनत कल की रोटी बनेगी।\"", "सर्दियाँ आईं तो चारों ओर बर्फ फैल गई। जानवरों को खाना नहीं मिला। तब चुनमुन ने अपना जमा किया हुआ खाना सबके साथ बाँटा।", "सबको अपनी लापरवाही पर शर्म आई। अगले साल सबने समय रहते तैयारी की।", "सीख: समय पर की गई तैयारी मुश्किल वक्त में काम आती है।"] },
  { id: 32, cat: "parivar", title: "दादाजी की छड़ी", mins: "1-2", body: ["मीनू को दादाजी की पुरानी छड़ी अच्छी नहीं लगती थी। वह कहती, \"दादाजी, नई छड़ी ले लीजिए, यह तो बहुत घिस गई है।\"", "दादाजी मुस्कुराकर बोले, \"इस छड़ी ने मेरे साथ चालीस साल का सफर देखा है।\"", "एक दिन दादाजी बीमार पड़ गए। मीनू ने उनकी सेवा की और उन्हें उसी छड़ी के सहारे आँगन तक टहलाया।", "तब उसने देखा कि छड़ी पर उसके पिता और चाचा के बचपन के नाम खुदे थे।", "मीनू ने उस छड़ी को आदर से पकड़ा और कभी उसकी बुराई नहीं की।", "सीख: पुरानी चीजों में परिवार की यादें और अनुभव छिपे होते हैं।"] },
  { id: 33, cat: "darawni", title: "खिड़की पर परछाईं", mins: "1-2", body: ["निधि अकेले किराए के कमरे में रहने आई थी। हर रात उसे खिड़की पर एक लंबी परछाईं हिलती दिखती थी।", "डर के मारे उसकी नींद उड़ गई। उसने पड़ोसन से बताया तो पड़ोसन बोली, \"कल रात तुम खिड़की के पास कुर्सी रखकर बैठो और देखो।\"", "निधि ने हिम्मत करके रात में खिड़की खोली। बाहर एक पुराने पेड़ की टहनी हवा में हिल रही थी और पास की स्ट्रीट लाइट से उसकी लंबी परछाईं पर्दे पर पड़ती थी।", "अगले दिन निधि ने टहनी कटवा दी और चैन से सोने लगी।", "सीख: डर अक्सर अधूरी जानकारी से पैदा होता है, सच देखने पर वह कम हो जाता है।"] },
  { id: 34, cat: "seekh", title: "झूठ का जाल", mins: "1-2", body: ["विशाल को होमवर्क करना पसंद नहीं था। एक दिन उसने शिक्षक से झूठ कहा कि उसकी कॉपी खो गई है।", "अगले दिन कॉपी दिखाने के लिए उसे दूसरा झूठ बोलना पड़ा कि उसकी तबीयत खराब थी। फिर तीसरा झूठ, फिर चौथा।", "धीरे-धीरे उसके झूठ आपस में टकराने लगे। शिक्षक ने उसे बुलाकर पूछा तो वह कुछ जवाब नहीं दे पाया।", "रोते हुए उसने सच बता दिया। शिक्षक ने कहा, \"अगर तुमने पहले दिन सच कहा होता तो बात छोटी रहती।\"", "उस दिन से विशाल ने कभी झूठ का सहारा नहीं लिया।", "सीख: एक झूठ को छिपाने के लिए कई झूठ बोलने पड़ते हैं, इसलिए पहले दिन ही सच बोलना अच्छा है।"] },
  { id: 35, cat: "bachche", title: "रंग-बिरंगी तितली", mins: "1-2", body: ["एक बगीचे में एक तितली रहती थी, जिसके पंख बहुत रंगीन थे। उसे अपने रंगों पर बहुत घमंड था और वह दूसरे कीड़ों से बात नहीं करती थी।", "एक दिन तेज बारिश आ गई। तितली के पंख भीग गए और वह उड़ नहीं पाई। वह कीचड़ में गिर पड़ी।", "तभी एक नन्ही चींटी ने अपने साथियों को बुलाया। सबने मिलकर उसे एक सूखे पत्ते पर पहुँचाया।", "तितली की आँखों में आँसू आ गए। उसने कहा, \"मेरे रंग मुझे नहीं बचा पाए, तुम्हारी मदद ने बचाया।\"", "उस दिन के बाद वह सबके साथ प्यार से रहने लगी।", "सीख: घमंड नहीं, मिलजुलकर रहना हमें मुश्किल से बचाता है।"] },
  { id: 36, cat: "parivar", title: "बहन की राखी", mins: "1-2", body: ["रक्षाबंधन से पहले आरव अपनी बहन पायल से नाराज था, क्योंकि उसने उसका पसंदीदा खिलौना तोड़ दिया था। उसने तय किया कि वह इस बार राखी नहीं बँधवाएगा।", "पायल चुपचाप अपने कमरे में गई। उसने अपनी गुल्लक तोड़ी और बाजार से सुंदर राखी और भैया की पसंद की मिठाई ले आई।", "वह आरव के पास आकर बोली, \"भैया, खिलौना टूट गया तो नया आ जाएगा, पर आप नाराज रहे तो मुझे अच्छा नहीं लगेगा।\"", "आरव का गुस्सा पिघल गया। उसने बहन से माफी माँगी और राखी बँधवाई।", "सीख: रिश्तों में अहंकार से बड़ा प्यार और माफी का भाव होता है।"] },
  { id: 37, cat: "sangharsh", title: "रिक्शेवाले का सपना", mins: "1-2", body: ["हरिया रोज सुबह से रात तक रिक्शा चलाता था। उसका सपना था कि उसका बेटा अफसर बने।", "कभी बारिश में सवारी नहीं मिलती, कभी पुलिस वाले परेशान करते। फिर भी वह हर शाम बेटे की किताबों के लिए कुछ पैसे बचाता।", "बेटा समझदार था। वह दिनभर स्कूल में पढ़ता और शाम को पिता के साथ रिक्शा धोने में मदद करता।", "सालों बाद बेटे ने प्रतियोगी परीक्षा पास की। पहले दिन वह अफसर की वर्दी में उसी रिक्शे पर बैठकर पिता के साथ घर आया।", "हरिया की आँखें भर आईं।", "सीख: मेहनत और त्याग कभी बेकार नहीं जाते।"] },
  { id: 38, cat: "bachche", title: "नदी की मछली", mins: "1-2", body: ["एक नदी में छोटी मछली मोनी रहती थी। नदी का पानी दिनोंदिन गंदा होता जा रहा था, क्योंकि लोग कचरा फेंक देते थे।", "मोनी ने अपने मित्र बगुले से कहा, \"कोई तो इन्हें समझाए।\"", "बगुले ने गाँव के बच्चों को नदी की हालत दिखाई। बच्चों ने मिलकर नदी किनारे सफाई की और एक बोर्ड लगाया, \"नदी हमारी माँ है, इसे साफ रखिए।\"", "धीरे-धीरे लोगों ने कचरा फेंकना बंद कर दिया। नदी फिर से साफ हो गई और मछलियाँ खुशी से तैरने लगीं।", "सीख: साफ-सफाई की जिम्मेदारी हम सबकी है।"] },
  { id: 39, cat: "hasya", title: "मोबाइल की खोज", mins: "1-2", body: ["सुबह-सुबह गुड्डू घर भर में चिल्ला रहा था, \"मेरा मोबाइल कहाँ है? किसी ने देखा?\"", "माँ ने तकिया हटाया, पापा ने अलमारी खँगाली, बहन ने बिस्तर उलटा दिया। सब थक गए।", "आखिर बहन ने कहा, \"भैया, मेरे फोन से अपने नंबर पर रिंग कर लेते हैं।\"", "उसने रिंग किया तो आवाज आई, \"ट्रिंग ट्रिंग।\" और वह आवाज गुड्डू की अपनी जेब से आ रही थी, क्योंकि वह हाथ में टॉर्च वाला दूसरा फोन लेकर पहले वाले को ढूँढ रहा था।", "पूरा घर हँसते-हँसते लोटपोट हो गया।", "सीख: कोई चीज खोजने से पहले एक बार शांति से अपने आसपास देख लेना चाहिए।"] },
  { id: 40, cat: "darawni", title: "सुनसान स्टेशन", mins: "1-2", body: ["रात के दो बजे अमित की ट्रेन छूट गई। सुनसान स्टेशन पर केवल एक बेंच और टिमटिमाता बल्ब था।", "तभी उसे दूर से किसी के खाँसने की आवाज आई। उसका दिल जोर से धड़कने लगा। आवाज पास आती गई।", "अचानक अँधेरे से एक बूढ़ा चाय वाला हाथ में केतली लिए सामने आया। वह बोला, \"बेटा, घबराओ मत। रात की गाड़ी के लिए मैं रोज यहाँ चाय लेकर बैठता हूँ।\"", "अमित हँसकर बोला, \"आपने तो मेरी जान ही निकाल दी थी।\"", "दोनों ने गरम चाय पी और सुबह की ट्रेन तक बातें करते रहे।", "सीख: अँधेरे में अक्सर हमारा डर सच से बड़ा दिखता है।"] },
  { id: 41, cat: "prerak", title: "स्ट्रीट लाइट के नीचे", mins: "1-2", body: ["सोनू के घर में बिजली नहीं थी, इसलिए वह रोज रात को सड़क की बत्ती के नीचे बैठकर पढ़ता था। राहगीर उसे देखकर मुस्कुराते, कुछ मजाक भी उड़ाते।", "सोनू ने किसी की बात पर ध्यान नहीं दिया। उसका लक्ष्य साफ था, उसे अच्छे अंक लाने थे।", "साल के अंत में उसने जिले में टॉप किया। अखबार में उसकी तस्वीर छपी, जिसमें वह उसी बत्ती के नीचे किताब लिए बैठा था।", "अब गाँव के लोग कहने लगे, \"वह बत्ती तो सोनू की किस्मत की रोशनी थी।\"", "सीख: साधन कम हों तो भी लगन से सफलता मिल सकती है।"] },
  { id: 42, cat: "sangharsh", title: "चाय की टपरी", mins: "1-2", body: ["नंदू की नौकरी छूट गई तो उसके पास कोई सहारा नहीं बचा। घर में बीवी और दो बच्चे थे।", "उसने अपनी बची हुई जमा-पूँजी से सड़क किनारे चाय की छोटी टपरी खोली। पहले दिन सिर्फ तीन ग्राहक आए।", "नंदू ने हार नहीं मानी। वह हर ग्राहक से मुस्कुराकर बात करता और चाय की गुणवत्ता का ध्यान रखता।", "धीरे-धीरे उसकी टपरी मशहूर हो गई। कुछ साल बाद उसने एक छोटा-सा रेस्तराँ खोल लिया।", "वह अक्सर कहता, \"नौकरी गई थी, हिम्मत नहीं।\"", "सीख: मुश्किल समय में भी हिम्मत रखने से नए रास्ते खुलते हैं।"] },
  { id: 43, cat: "parivar", title: "माँ के हाथ की रोटी", mins: "1-2", body: ["शहर में नौकरी करने वाला राजीव छुट्टियों में घर आया। माँ ने उसके लिए रोटी बनाई, जो थोड़ी जली हुई थी।", "राजीव ने कुछ नहीं कहा और चुपचाप खा ली। रात को उसने पिता से पूछा, \"माँ की रोटी जल क्यों गई?\"", "पिता बोले, \"तुम्हारे आने की खुशी में वह पूरे दिन रसोई में व्यस्त थी। उसे अपनी थकान भी याद नहीं रही।\"", "राजीव की आँखें नम हो गईं। उसने माँ के पास जाकर कहा, \"आज की जली रोटी मुझे सबसे ज्यादा स्वादिष्ट लगी।\"", "माँ मुस्कुरा उठीं।", "सीख: माँ का प्यार स्वाद या रूप से नहीं, भावना से नापा जाता है।"] },
  { id: 44, cat: "bachche", title: "शरारती तोता", mins: "1-2", body: ["मीठू तोता सब कुछ सुनकर दोहरा देता था। एक दिन उसने रसोई में माँ और पापा की बात सुन ली कि वे जन्मदिन की सरप्राइज पार्टी की तैयारी कर रहे हैं।", "अगली सुबह जब मुन्ना उठा तो मीठू जोर से बोला, \"हैप्पी बर्थडे मुन्ना! केक अलमारी में है!\"", "माँ-पापा घबरा गए और मुन्ना हँसते-हँसते लोटपोट हो गया। सरप्राइज खराब हो गया, पर सब हँस पड़े।", "उस दिन के बाद माँ ने कहा, \"मीठू के सामने अब कोई राज की बात नहीं होगी!\"", "सीख: जो बात छिपानी हो, वह सोच-समझकर करनी चाहिए।"] },
  { id: 45, cat: "seekh", title: "घमंडी चित्रकार", mins: "1-2", body: ["एक चित्रकार को अपनी कला पर बहुत घमंड था। वह कहता था कि उससे बेहतर कोई नहीं बना सकता।", "एक बार उसने एक चित्र बनाकर चौराहे पर रखा और लिखा, \"जहाँ कमी लगे, वहाँ निशान लगा दें।\"", "शाम तक पूरे चित्र पर निशान लग गए। वह निराश हुआ।", "अगले दिन उसने वही चित्र दोबारा रखा और लिखा, \"जहाँ कमी लगे, उसे ठीक कर दें।\"", "शाम तक चित्र पर एक भी निशान या सुधार नहीं मिला। लोग निशान लगा सकते थे, पर ठीक करना कठिन था।", "चित्रकार समझ गया कि आलोचना आसान है, सुधार कठिन। उसने घमंड छोड़ दिया।", "सीख: दूसरों की कमी निकालना आसान है, खुद बेहतर करना मुश्किल।"] },
  { id: 46, cat: "prerak", title: "टूटा हुआ बल्ला", mins: "1-2", body: ["आरिफ को क्रिकेट बहुत पसंद था, लेकिन उसके पास बल्ला नहीं था। उसने टूटे बल्ले को जोड़कर और टेप चिपकाकर खेलना शुरू किया।", "साथी खिलाड़ी हँसते थे, लेकिन आरिफ रोज अभ्यास करता रहा।", "एक दिन जिले की टीम के चयन में उसके शॉट देखकर कोच ने कहा, \"बल्ला जैसा भी हो, खिलाड़ी में दम है।\"", "आरिफ का चयन हो गया। उसने पहली कमाई से अपने दोस्तों के लिए भी बल्ले खरीदे।", "सीख: साधन से नहीं, लगन और अभ्यास से खिलाड़ी बनता है।"] },
  { id: 47, cat: "sangharsh", title: "सिलाई मशीन", mins: "1-2", body: ["पति के गुजर जाने के बाद शांति के सामने तीन बच्चों को पालने की चुनौती थी। उसके पास केवल एक पुरानी सिलाई मशीन थी।", "उसने मोहल्ले के कपड़े सिलने शुरू किए। कभी रात-रात भर काम करती और सुबह बच्चों को स्कूल भेजती।", "धीरे-धीरे उसका काम बढ़ा। उसने दो-तीन औरतों को भी अपने साथ काम पर रख लिया।", "कुछ वर्षों में उसकी छोटी-सी दुकान \"शांति बुटीक\" के नाम से मशहूर हो गई।", "उसके बच्चों ने पढ़-लिखकर अच्छी नौकरी पाई, और माँ की मशीन को उन्होंने शीशे के बक्से में सजाकर रखा।", "सीख: संघर्ष में हिम्मत रखने वाला इंसान अपनी राह खुद बना लेता है।"] },
  { id: 48, cat: "prerak", title: "पहली उड़ान", mins: "1-2", body: ["एक ऊँचे पेड़ पर चिड़िया का घोंसला था, जिसमें एक छोटा चूजा बैठा था। उसे उड़ने से डर लगता था।", "माँ चिड़िया बोली, \"डर तभी जाता है जब तुम पंख फैलाते हो।\"", "चूजे ने आँखें बंद कीं और डाल से छलाँग लगाई। पहली बार वह थोड़ा लड़खड़ाया, फिर दूसरी बार थोड़ा और ऊपर गया।", "कुछ ही दिनों में वह खुले आसमान में उड़ने लगा।", "उसने नीचे झाँककर कहा, \"अगर मैं उस दिन छलाँग न लगाता तो कभी जान ही नहीं पाता कि मैं उड़ सकता हूँ।\"", "सीख: डर के आगे ही आसमान है, बस पहला कदम उठाने की देर है।"] },
  { id: 49, cat: "prerak", title: "सुबह की दौड़", mins: "1-2", body: ["रमेश का वजन बढ़ गया था और डॉक्टर ने उसे रोज टहलने की सलाह दी थी। पहले दिन वह सिर्फ पाँच मिनट दौड़ पाया और हाँफने लगा।", "लोग हँसे, \"यह क्या दौड़ेगा?\" पर रमेश ने रोज थोड़ा-थोड़ा समय बढ़ाया।", "छह महीने बाद वह पूरे पाँच किलोमीटर दौड़ने लगा। एक साल बाद उसने मोहल्ले की मैराथन में हिस्सा लिया।", "उसने रेस जीती नहीं, पर पूरी की। फिनिश लाइन पर उसने कहा, \"आज मैं अपने कल से जीत गया।\"", "सीख: असली मुकाबला दूसरों से नहीं, अपने आपसे होता है।"] },
  { id: 50, cat: "seekh", title: "कंजूस सेठ और भिखारी", mins: "1-2", body: ["एक कंजूस सेठ था, जो धन तो बहुत रखता पर किसी को एक पैसा नहीं देता था।", "एक दिन भूखा भिखारी उसके दरवाजे पर आया। सेठ ने उसे डाँटकर भगा दिया।", "कुछ दिनों बाद सेठ यात्रा पर गया और रास्ते में लुटेरों ने उसका सारा धन लूट लिया। भूखा-प्यासा वह एक गाँव में पहुँचा।", "वहाँ वही भिखारी मिला, जिसने अपनी आधी रोटी सेठ को दे दी। सेठ की आँखें भर आईं।", "उसने उस दिन से दान और मदद का महत्त्व समझा और जीवन भर लोगों की सेवा की।", "सीख: धन केवल जमा करने के लिए नहीं, जरूरतमंदों की मदद के लिए भी होता है।"] },
  { id: 51, cat: "bachche", title: "छोटी चिड़िया और बारिश", mins: "1-2", body: ["एक छोटी चिड़िया का घोंसला तेज बारिश में टूट गया। वह दुखी होकर पेड़ की डाल पर बैठ गई।", "पास में रहने वाले गिलहरी, कबूतर और तोते ने उसकी हालत देखी। सबने मिलकर सूखी घास और टहनियाँ लाईं।", "कुछ घंटों में एक नया, मजबूत घोंसला तैयार हो गया।", "चिड़िया ने सबको धन्यवाद दिया। कबूतर बोला, \"दोस्त वही जो मुश्किल में काम आए।\"", "उस दिन जंगल में सबकी दोस्ती और गहरी हो गई।", "सीख: मदद का हाथ बढ़ाने से मुश्किल आसान हो जाती है।"] },
  { id: 52, cat: "parivar", title: "दादी की कहानी", mins: "1-2", body: ["रात को सारे बच्चे दादी के पास कहानी सुनने बैठ जाते थे। लेकिन आजकल सब मोबाइल में लगे रहते थे और दादी अकेली बैठी रहती थीं।", "एक दिन बिजली चली गई। बच्चे ऊबकर इधर-उधर घूम रहे थे। दादी ने मुस्कुराकर कहा, \"आओ, एक कहानी सुनो।\"", "मोमबत्ती की रोशनी में दादी ने ऐसी कहानी सुनाई कि सब मंत्रमुग्ध हो गए।", "बच्चों ने उस रात तय किया कि रोज एक घंटा दादी के साथ बिताएँगे। उस दिन से घर में फिर से कहानियों की महफिल जमने लगी।", "सीख: बड़ों के साथ बिताया समय बच्चों के लिए अनमोल सीख बन जाता है।"] },
  { id: 53, cat: "darawni", title: "पुराना कुआँ", mins: "1-2", body: ["गाँव के बाहर एक पुराना सूखा कुआँ था। लोग कहते थे कि रात में उसमें से किसी के रोने की आवाज आती है।", "एक दिन गाँव का लड़का कबीर हिम्मत करके रात में वहाँ पहुँचा। सचमुच कुएँ से \"ऊँ… ऊँ…\" की आवाज आ रही थी।", "उसने टॉर्च जलाकर नीचे झाँका। वहाँ एक कुत्ते का पिल्ला गिरा पड़ा था और भूख से कराह रहा था।", "कबीर ने रस्सी की मदद से उसे निकाला और घर ले गया। गाँव वालों को पता चला तो सबने कुएँ पर जाली लगवा दी।", "सीख: अनजाने डर को समझने के लिए हिम्मत और समझदारी से काम लेना चाहिए।"] },
  { id: 54, cat: "seekh", title: "बोले हुए शब्द", mins: "1-2", body: ["एक लड़के को बात-बात पर गुस्सा आता था और वह सबको कड़वी बातें बोल देता था।", "उसके पिता ने उसे कीलों से भरा एक डिब्बा दिया और कहा, \"जब भी गुस्सा आए, दीवार में एक कील ठोक देना।\"", "लड़के ने कुछ ही दिनों में पूरी दीवार कीलों से भर दी। फिर पिता ने कहा, \"जब भी गुस्सा रोक पाओ, एक कील निकालना।\"", "धीरे-धीरे उसने सारी कीलें निकाल दीं। पिता ने दीवार दिखाकर कहा, \"कीलें निकल गईं, पर निशान रह गए। कड़वे शब्द भी ऐसे ही निशान छोड़ जाते हैं।\"", "लड़के ने कसम खाई कि वह सोच-समझकर बोलेगा।", "सीख: कहे हुए शब्द वापस नहीं आते, इसलिए सोच-समझकर बोलना चाहिए।"] },
  { id: 55, cat: "bachche", title: "नन्हा भालू और दोस्ती", mins: "1-2", body: ["जंगल का एक नन्हा भालू बॉबी अकेला रहता था। उसके पास कोई दोस्त नहीं था, क्योंकि वह शर्मीला था।", "एक दिन उसे एक घायल खरगोश मिला। बॉबी ने डरते हुए उसकी पट्टी की और उसे अपनी गुफा में रखा।", "खरगोश ठीक हो गया और बोला, \"तुम तो बहुत अच्छे हो। हम दोस्त बनेंगे?\"", "फिर खरगोश ने बॉबी को बाकी जानवरों से भी मिलवाया। जल्द ही बॉबी के कई दोस्त बन गए।", "उसने जाना कि दोस्ती के लिए बस पहला कदम बढ़ाना जरूरी होता है।", "सीख: दयालुता से सच्चे दोस्त बनते हैं।"] },
  { id: 56, cat: "parivar", title: "पिता की साइकिल", mins: "1-2", body: ["आर्यन के पिता रोज पुरानी साइकिल से दफ्तर जाते थे। आर्यन को शर्म आती थी कि दोस्तों के पिता कार से आते हैं।", "एक दिन उसके स्कूल में पुरस्कार वितरण था। उसके पिता बारिश में भीगते हुए साइकिल से पहुँचे, ताकि उसका पुरस्कार देख सकें।", "मंच पर आर्यन ने कहा, \"आज मैं जो कुछ हूँ, अपने पिता की मेहनत की वजह से हूँ, जिन्होंने अपनी जरूरतें कम करके मेरी पढ़ाई पूरी करवाई।\"", "पूरा हॉल तालियों से गूँज उठा। आर्यन ने पिता को गले लगा लिया।", "सीख: माता-पिता का त्याग किसी भी दिखावे से बड़ा होता है।"] },
  { id: 57, cat: "sangharsh", title: "रेलवे स्टेशन की पढ़ाई", mins: "1-2", body: ["सुरेश का परिवार रेलवे स्टेशन के पास झोपड़ी में रहता था। घर में पढ़ाई की जगह नहीं थी, इसलिए वह प्लेटफॉर्म की बेंच पर बैठकर पढ़ता था।", "शोर के बीच भी उसने अपना ध्यान नहीं भटकने दिया। रोज शाम को वह कुलीगिरी करके थोड़ी कमाई भी कर लेता।", "एक दिन स्टेशन मास्टर ने उसकी लगन देखी और उसे रात में दफ्तर के एक कोने में पढ़ने की इजाजत दे दी।", "सालों बाद वही सुरेश रेलवे में अफसर बना और उसी स्टेशन पर तैनात हुआ।", "सीख: हालात कितने भी कठिन हों, लगन उन्हें बदल सकती है।"] },
  { id: 58, cat: "bachche", title: "बादल का संदेश", mins: "1-2", body: ["एक गाँव में कई सालों से बारिश नहीं हुई थी। खेत सूख गए थे और बच्चे उदास थे।", "गाँव की छोटी बच्ची तारा रोज पेड़ लगाती और पानी देती। लोग कहते, \"इससे क्या होगा?\"", "तारा बोली, \"पेड़ होंगे तो बादल भी आएँगे।\"", "कुछ साल में आसपास हरियाली फैल गई और एक दिन आसमान में काले बादल घिर आए। खूब बारिश हुई और पूरा गाँव खुशी से झूम उठा।", "बच्चे तारा को शुक्रिया कहने लगे। तारा मुस्कुराकर बोली, \"अब हम सब मिलकर और पेड़ लगाएँगे।\"", "सीख: पेड़ लगाने से प्रकृति भी हमारा साथ देती है।"] },
  { id: 59, cat: "hasya", title: "चश्मा कहाँ है", mins: "1-2", body: ["दादाजी सुबह से अपना चश्मा ढूँढ रहे थे। उन्होंने पूरे घर में खोज मचा दी।", "\"बेटा, मेरा चश्मा कहीं दिख रहा है?\" उन्होंने अपने पोते से पूछा।", "पोता हँसकर बोला, \"दादाजी, वह तो आपके माथे पर चढ़ा है!\"", "दादाजी ने हाथ फेरा तो चश्मा वहीं मिला। बोले, \"अरे! तब तो मैं बिना चश्मे के चश्मा ढूँढ रहा था!\"", "पूरा घर हँस पड़ा और दादाजी भी अपनी भूल पर खूब हँसे।", "सीख: कभी-कभी जिसे हम दूर ढूँढते हैं, वह हमारे पास ही होता है।"] },
  { id: 60, cat: "darawni", title: "रात की लाइब्रेरी", mins: "1-2", body: ["कॉलेज की लाइब्रेरी में रात को पढ़ने वाले कुछ छात्र कहते थे कि आखिरी अलमारी के पास किताबें अपने आप गिर जाती हैं।", "एक रात अनन्या ने सच जानने का फैसला किया। वह चुपचाप वहाँ बैठ गई।", "थोड़ी देर बाद एक किताब धड़ाम से गिरी। अनन्या ने तुरंत देखा तो ऊपर के शेल्फ पर बैठी एक मोटी बिल्ली किताबों के पीछे से झाँक रही थी।", "बिल्ली खिड़की से अंदर आ जाती थी और शरारत में किताबें गिरा देती थी।", "अनन्या ने खिड़की बंद करवा दी और लाइब्रेरी में फिर शांति हो गई।", "सीख: डर का कारण खोजने पर अक्सर वह मामूली निकलता है।"] },
  { id: 61, cat: "prerak", title: "टीम का कप्तान", mins: "1-2", body: ["स्कूल की क्रिकेट टीम लगातार हार रही थी। सब खिलाड़ी निराश थे और आपस में झगड़ने लगे थे।", "नए कप्तान अमन ने सबको इकट्ठा किया और कहा, \"हम हार इसलिए रहे हैं क्योंकि हम एक-दूसरे का साथ नहीं दे रहे।\"", "उसने हर खिलाड़ी की खूबी पहचानी और उसी हिसाब से भूमिका दी। रोज साथ में अभ्यास हुआ।", "अगले टूर्नामेंट में टीम ने शानदार प्रदर्शन किया और फाइनल जीत लिया।", "ट्रॉफी लेते समय अमन ने कहा, \"यह जीत किसी एक की नहीं, पूरी टीम की है।\"", "सीख: अच्छा नेता वही है जो सबको साथ लेकर चलता है।"] },
  { id: 62, cat: "sangharsh", title: "ठेले वाला", mins: "1-2", body: ["रामदीन रोज सुबह सब्जियों का ठेला लेकर गलियों में घूमता था। बारिश हो या धूप, वह रुकता नहीं था।", "एक दिन तेज बारिश में उसका ठेला पलट गया और सारी सब्जियाँ खराब हो गईं। वह टूट गया।", "मोहल्ले के लोगों ने उसकी हालत देखी और अपनी तरफ से कुछ पैसे इकट्ठे कर उसे दिए।", "रामदीन ने कुछ दिनों बाद फिर काम शुरू किया और बाद में छोटी-सी दुकान खोली। वह कहता था, \"मेहनत और लोगों का भरोसा मेरी असली पूँजी है।\"", "सीख: ईमानदारी से किया काम मुश्किल समय में सहारा बनता है।"] },
  { id: 63, cat: "parivar", title: "भाई-भाई का बँटवारा", mins: "1-2", body: ["पिता के जाने के बाद दो भाई, सुरेंद्र और महेंद्र, जमीन के बँटवारे को लेकर झगड़ने लगे। घर में तनाव फैल गया।", "उनकी बूढ़ी माँ ने दोनों को बुलाया और कहा, \"तुम्हारे पिता ने यह जमीन अपने खून-पसीने से बनाई थी, ताकि तुम दोनों साथ रहो।\"", "माँ की बात सुनकर दोनों को अपनी गलती समझ आई। उन्होंने जमीन को आपस में बराबर बाँटा और बीच में एक साझा आँगन बना लिया।", "उस दिन के बाद घर में फिर से प्यार लौट आया।", "सीख: जमीन-जायदाद से ज्यादा कीमती भाई-भाई का रिश्ता होता है।"] },
  { id: 64, cat: "bachche", title: "बकरी का बच्चा और पतंग", mins: "1-2", body: ["एक बकरी का बच्चा चिंटू आसमान में उड़ती रंग-बिरंगी पतंगें देखकर सोचता था कि काश वह भी उड़ पाता।", "एक दिन एक पतंग कटकर उसके पास गिरी। उसने धागा पकड़कर उड़ने की कोशिश की, पर सिर्फ गिरकर घुटना छिलवा बैठा।", "उसकी माँ ने प्यार से कहा, \"बेटा, हर किसी की अपनी खासियत होती है। तुम्हारी खासियत पहाड़ों पर कूदना है।\"", "चिंटू ने पहाड़ पर चढ़कर ऊँची-ऊँची छलाँगें लगाईं और खुश हो गया।", "सीख: दूसरों जैसा बनने की जगह अपनी खासियत को पहचानो।"] },
  { id: 65, cat: "seekh", title: "समय की कीमत", mins: "1-2", body: ["अमित हमेशा काम को कल पर टालता रहता था। \"कल कर लूँगा\" उसका तकिया-कलाम बन गया था।", "परीक्षा नजदीक आई तो उसकी तैयारी अधूरी रह गई। समय कम था और पाठ्यक्रम बहुत ज्यादा।", "वह परीक्षा में अच्छे अंक नहीं ला पाया। उसके शिक्षक ने कहा, \"समय किसी का इंतजार नहीं करता।\"", "अमित को अपनी गलती समझ आई। उसने रोज का काम रोज करने का नियम बनाया।", "अगली परीक्षा में उसने बहुत अच्छा प्रदर्शन किया।", "सीख: जो काम आज हो सकता है, उसे कल पर मत टालो।"] },
  { id: 66, cat: "prerak", title: "दीवार पर लिखा सपना", mins: "1-2", body: ["तनु ने अपने कमरे की दीवार पर बड़े अक्षरों में लिखा, \"मुझे गायिका बनना है।\" उसके पास न संगीत की शिक्षा थी, न साधन।", "वह रोज यूट्यूब पर वीडियो देखकर रियाज करती। परिवार वाले पहले हँसे, फिर उसकी मेहनत देखकर चुप हो गए।", "एक दिन उसने स्कूल के कार्यक्रम में गाना गाया और सबकी तालियाँ बटोरीं। एक संगीत शिक्षक ने उसे मुफ्त में सिखाने का वादा किया।", "कुछ सालों में तनु ने कई मंचों पर गाना गाया। दीवार पर लिखा सपना सच हो चुका था।", "सीख: सपना देखने के साथ उसे रोज दोहराना और मेहनत करना जरूरी है।"] },
  { id: 67, cat: "sangharsh", title: "बाढ़ के बाद", mins: "1-2", body: ["बाढ़ में गोपाल का घर और खेत सब बह गए। पूरा गाँव राहत शिविर में रहने को मजबूर हो गया।", "कई लोग निराश होकर बैठ गए, पर गोपाल ने कहा, \"रोने से कुछ नहीं बदलेगा। हमें फिर से शुरुआत करनी होगी।\"", "उसने गाँव के लोगों को इकट्ठा किया। सबने मिलकर कीचड़ साफ किया, घर बनाए और खेत फिर से जोते।", "कुछ महीनों में गाँव फिर से हरा-भरा हो गया। लोग गोपाल को अपना मार्गदर्शक मानने लगे।", "सीख: मुसीबत में निराश होने के बजाय मिलकर नई शुरुआत करनी चाहिए।"] }
];

  parivar: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  darawni: '<path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/>',
  prem: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  hasya: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/>',
  sangharsh: '<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>'
};
function icon(id) {
  var c = catOf(id);
  var s = el('span', { 'class': 'ic', 'aria-hidden': 'true' });
  if (c) s.style.setProperty('--ic', c.color);
  s.innerHTML = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' + ICONS[id] + '</svg>';
  return s;
}

function header() {
  var brand = el('a', { 'class': 'brand', href: '#' }, [
    el('h1', { text: 'Gourav Spark Hindi Kahaniyan' }),
    el('p', { text: 'हर कहानी, अपनी श्रेणी में' })
  ]);
  return el('header', { 'class': 'top' }, [brand]);
}

function chips(activeId) {
  var wrap = el('nav', { 'class': 'chips', 'aria-label': 'कहानी की श्रेणियाँ' });
  var all = el('a', { 'class': 'chip', href: '#' }, [
    icon('all'), el('span', { text: 'सभी' }), el('span', { 'class': 'n', text: String(STORIES.length) })
  ]);
  if (!activeId) all.setAttribute('aria-current', 'true');
  wrap.appendChild(all);
  CATS.forEach(function (c) {
    var a = el('a', { 'class': 'chip', href: '#cat-' + c.id }, [
      icon(c.id), el('span', { text: c.name }), el('span', { 'class': 'n', text: String(count(c.id)) })
    ]);
    if (c.id === activeId) a.setAttribute('aria-current', 'true');
    wrap.appendChild(a);
  });
  return wrap;
}

var EYE = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
var HEART = '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>';
function svg(paths) {
  var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
  s.innerHTML = paths; return s;
}

/* ---- व्यू और लाइक: db में, हर देखने वाले का एक दस्तावेज़ ---- */
var DB = null, UID = null, CAN_WRITE = false;
var allViews = {}, allLikes = {};      // uid -> { s1: true, ... }
var myViews = {}, myLikes = {};
var writing = { views: Promise.resolve(), likes: Promise.resolve() };

function tally(all, id) {
  var n = 0, k = 's' + id;
  for (var u in all) if (all[u] && all[u][k]) n++;
  return n;
}
function counter(kind, id, paths) {
  var c = el('span', { 'class': 'cnt', 'data-kind': kind, 'data-id': String(id) });
  c.appendChild(svg(paths));
  c.appendChild(el('span', { text: '0' }));
  c.hidden = !DB;
  return c;
}
function paintCounts() {
  document.querySelectorAll('[data-kind]').forEach(function (n) {
    var all = n.getAttribute('data-kind') === 'views' ? allViews : allLikes;
    n.hidden = !DB;
    var t = n.querySelector('span:last-child');
    if (t) t.textContent = String(tally(all, n.getAttribute('data-id')));
  });
  var btn = document.getElementById('like-btn');
  if (btn) btn.setAttribute('aria-pressed', myLikes['s' + btn.getAttribute('data-id')] ? 'true' : 'false');
}
function saveMine(kind, mine) {
  if (!DB || !UID) return Promise.resolve();
  var body = {}; for (var k in mine) if (mine[k]) body[k] = true;
  writing[kind] = writing[kind].then(function () {
    return DB.doc(kind + '/' + UID).set(body);
  }).catch(function () {});
  return writing[kind];
}
function recordView(id) {
  var k = 's' + id;
  if (!DB || !UID || !CAN_WRITE || myViews[k]) return;
  myViews[k] = true;
  allViews[UID] = Object.assign({}, myViews);
  paintCounts();
  saveMine('views', myViews);
}
function toggleLike(id) {
  var k = 's' + id;
  if (!DB || !UID || !CAN_WRITE) return;
  if (myLikes[k]) delete myLikes[k]; else myLikes[k] = true;
  allLikes[UID] = Object.assign({}, myLikes);
  paintCounts();
  saveMine('likes', myLikes);
}
function statsBar(id) {
  var bar = el('div', { 'class': 'stats', id: 'stats-bar' });
  bar.hidden = !DB;
  var views = el('span', { 'class': 'stat', 'data-kind': 'views', 'data-id': String(id) });
  views.appendChild(svg(EYE)); views.appendChild(el('span', { text: '0' }));
  views.appendChild(el('span', { text: 'व्यू' }));
  var like = el('button', { 'class': 'stat', type: 'button', id: 'like-btn', 'data-id': String(id), 'aria-pressed': 'false', 'aria-label': 'कहानी पसंद आई, लाइक करें' });
  like.appendChild(svg(HEART));
  var lc = el('span', { 'data-kind': 'likes', 'data-id': String(id), text: '0' });
  like.appendChild(lc); like.appendChild(el('span', { text: 'लाइक' }));
  like.disabled = !CAN_WRITE;
  like.onclick = function () { toggleLike(id); };
  bar.appendChild(views); bar.appendChild(like);
  if (DB && !CAN_WRITE) bar.appendChild(el('div', { 'class': 'stat-note', id: 'stat-note', text: 'लाइक करने और व्यू जुड़ने के लिए इस पेज को योगदानकर्ता (Contributor) अधिकार के साथ खोलना होगा।' }));
  return bar;
}
function startStats() {
  if (!window.claude || !window.claude.use) return;
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
    DB = r[0]; if (!DB) return;
    var user = r[1];
    return Promise.all([user ? user.id() : null, user ? user.can('data.write') : null]).then(function (v) {
      UID = v[0]; CAN_WRITE = !!UID && v[1] !== false;
      ['views', 'likes'].forEach(function (kind) {
        DB.collection(kind).onSnapshot(function (snap) {
          var all = {};
          snap.docs.forEach(function (d) { all[d.id] = d.data(); });
          if (UID && all[UID]) { (kind === 'views' ? myViews = Object.assign({}, all[UID]) : myLikes = Object.assign({}, all[UID])); }
          if (kind === 'views') allViews = all; else allLikes = all;
          paintCounts();
        }, function () {});
      });
      route();
    });
  }).catch(function () {});
}

function card(s) {
  var c = catOf(s.cat);
  return el('a', { 'class': 'card', href: '#story-' + s.id }, [
    el('span', { 'class': 'cat' }, [icon(c.id), el('span', { text: c.name })]),
    el('h3', { text: s.title }),
    el('p', { text: s.body[0].length > 90 ? s.body[0].slice(0, 90) + '…' : s.body[0] }),
    el('span', { 'class': 'meta' }, [
      el('span', { text: s.mins + ' मिनट' }),
      counter('views', s.id, EYE), counter('likes', s.id, HEART)
    ])
  ]);
}

function home(activeId) {
  var list = STORIES.filter(function (s) { return !activeId || s.cat === activeId; });
  var c = activeId ? catOf(activeId) : null;
  var head = el('div', { 'class': 'list-head' }, [
    el('h2', { text: c ? c.name + ' कहानियाँ' : 'सभी कहानियाँ' }),
    el('span', { text: list.length + ' कहानी' })
  ]);
  var grid = el('div', { 'class': 'stories' }, list.map(card));
  app.replaceChildren(header(), chips(activeId), head, grid,
    el('footer', { text: 'हर कहानी सिर्फ़ एक श्रेणी में रखी गई है।' }));
}

function loadSize() { try { return localStorage.getItem('kg-size'); } catch (e) { return null; } }
function saveSize(v) { try { localStorage.setItem('kg-size', v); } catch (e) {} }
var SIZES = ['1rem', '1.125rem', '1.3rem', '1.5rem'];

function applySize(i) {
  document.documentElement.style.setProperty('--read-size', SIZES[i]);
  saveSize(String(i));
}

function reader(id) {
  var s = STORIES.filter(function (x) { return String(x.id) === id; })[0];
  if (!s) { location.hash = ''; return; }
  var c = catOf(s.cat);
  var idx = parseInt(loadSize() || '1', 10);
  if (isNaN(idx) || idx < 0 || idx >= SIZES.length) idx = 1;
  applySize(idx);

  var minus = el('button', { type: 'button', id: 'size-down', 'aria-label': 'अक्षर छोटे करें', text: 'अ-' });
  var plus = el('button', { type: 'button', id: 'size-up', 'aria-label': 'अक्षर बड़े करें', text: 'अ+' });
  minus.onclick = function () { if (idx > 0) { idx--; applySize(idx); } };
  plus.onclick = function () { if (idx < SIZES.length - 1) { idx++; applySize(idx); } };

  var bar = el('div', { 'class': 'bar' }, [
    el('a', { 'class': 'back', href: '#cat-' + c.id, text: '← ' + c.name + ' कहानियाँ' }),
    el('div', { 'class': 'sizes' }, [minus, plus])
  ]);
  var body = el('div', { 'class': 'body' }, s.body.map(function (p) { return el('p', { text: p }); }));

  var more = STORIES.filter(function (x) { return x.cat === s.cat && x.id !== s.id; });
  var seek = el('div', { 'class': 'seek' }, [
    el('h3', { text: 'और पढ़िए' }),
    el('div', { 'class': 'chips' }, [
      el('a', { 'class': 'chip', href: '#', text: 'सभी कहानियाँ' }),
      el('a', { 'class': 'chip', href: '#cat-' + c.id, text: 'सारी ' + c.name + ' कहानियाँ' })
    ])
  ]);

  var article = el('article', { 'class': 'reader' }, [
    bar,
    el('span', { 'class': 'tag' }, [icon(c.id), el('span', { text: c.name + ' · ' + s.mins + ' मिनट' })]),
    el('h2', { text: s.title }),
    body,
    statsBar(s.id),
    seek
  ]);
  app.replaceChildren(header(), article);
  paintCounts();
  recordView(s.id);
}

function route() {
  var h = location.hash.replace(/^#/, '');
  if (h.indexOf('story-') === 0) reader(h.slice(6));
  else if (h.indexOf('cat-') === 0 && catOf(h.slice(4))) home(h.slice(4));
  else home(null);
  paintCounts();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
startStats();
</script>
</body>
</html>
